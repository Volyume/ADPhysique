# Maestro configuration.
#
# Maestro reads this when you run `maestro test e2e/` so flow files
# don't have to repeat the appId. Override per-flow by setting
# appId at the top of the YAML.

appId: app.volyume

# Tags let CI run a focused subset.
# Smoke = the must-pass-before-merge bundle.
# Full  = every locked critical path (the 12 flows from TESTING_STRATEGY_LOCKED.md).
tags:
  default:
    - smoke

# Wait long enough for first-launch SQLite seed (exercises + OFF + CoFID).
# Real cold launch on a mid-range Android takes ~6-8s. CI cold-boot
# headroom = much more (emulator + 30k+ row seed import). Bumped to
# 60s so the smoke flow doesn't false-fail on a slow first launch.
launchTimeoutMs: 60000
