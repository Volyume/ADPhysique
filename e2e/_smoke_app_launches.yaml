# Smoke: the app launches and the cold-start surface paints.
# If this fails, every other flow will too. Run it first.
#
# Cold launch on a real device hits: splash -> RootNavigator -> auth
# resolve -> either Welcome (signed out) or Train (signed in). We
# accept either landing surface so the flow stays useful in both
# states.

appId: app.volyume
tags:
  - smoke
  - foundation
---
- launchApp:
    clearState: false
    stopApp: true

# The wordmark splash is up first. Maestro caches the screen graph
# so this also catches a black-screen / hard-crash regression.
- assertVisible:
    text: ".*"
    optional: false

# Within 12s the app should be past the splash. Either the signed-out
# Welcome screen tagline OR the signed-in Train tab is acceptable.
- runFlow:
    when:
      visible:
        text: "Less thinking. More lifting."
    commands:
      - assertVisible: "Less thinking. More lifting."
- runFlow:
    when:
      visible:
        text: "Train"
    commands:
      - assertVisible: "Train"
