# Scan miss -> OCR fallback path.
#
# Spec: TESTING_STRATEGY_LOCKED.md § E2E line 128
# "scan_barcode_miss_ocr.yaml -- (move #1.5) scan miss -> OCR"
#
# Status: BLOCKED. Same blocker as scan_barcode_happy_path: needs a
# fixture-injection hook to drive the OCR side too. When the hook
# lands, this flow:
#   1. Opens scanner with a barcode that resolves nothing.
#   2. Tabs to OCR.
#   3. Injects a label-photo fixture.
#   4. Confirms the parsed macros load into the detail sheet.

appId: app.volyume
tags:
  - full
  - food
  - blocked
---
- launchApp:
    clearState: false

- assertVisible:
    text: "__MAESTRO_TEST_HOOK_OCR_FIXTURE_AVAILABLE__"
    timeout: 1
    optional: false

# Below this line is the real flow, kept ready for promotion.

- tapOn: "Diary"
- tapOn: "Scan"
- openLink: "volyume://test/barcode/0000000000000"

- assertVisible:
    text: ".*not.*found.*"
    timeout: 6000

- tapOn: "Scan label"
- openLink: "volyume://test/ocr/sample-uk-label"

- assertVisible:
    text: ".*kcal.*"
    timeout: 6000

- tapOn: "Add"
- assertVisible: "Diary"
