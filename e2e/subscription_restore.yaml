# Subscription restore on new install.
#
# Spec: TESTING_STRATEGY_LOCKED.md § E2E line 132
# "subscription_restore.yaml -- (move #5) restore on new install"
#
# Status: BLOCKED. Needs the IAP sandbox + a Play tester account
# with an active subscription on the test Google account. Until
# that's in place the flow stays guarded.

appId: app.volyume
tags:
  - full
  - payments
  - blocked
---
- launchApp:
    clearState: true

- assertVisible:
    text: "__MAESTRO_TEST_HOOK_PLAY_SANDBOX_AVAILABLE__"
    timeout: 1
    optional: false

# Below this line is the real flow, kept ready for promotion.

# Sign in with a Play account that already has a Pro subscription.
- assertVisible: "Less thinking. More lifting."
- tapOn: "Sign in"
- tapOn:
    id: "email"
    optional: true
- inputText: "maestro-restore@volyume.test"
- tapOn:
    id: "password"
    optional: true
- inputText: "MaestroTestPwd!1"
- tapOn:
    text: "Sign in"
    index: 1

# Restore from Settings.
- tapOn: "You"
- tapOn: "Subscription"
- tapOn: "Restore purchases"

- assertVisible:
    text: ".*Pro.*restored.*"
    timeout: 15000
