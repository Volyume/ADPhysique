# Log the first meal: search -> add -> see in diary.
#
# Spec: TESTING_STRATEGY_LOCKED.md § E2E line 125
# "diary_log_first_meal.yaml -- search -> add -> see in diary"
#
# Assumes the user is signed in and onboarded. The flow taps
# through the Search tab -> picks a result -> goes back to Diary
# and asserts the food row appears.

appId: app.volyume
tags:
  - smoke
  - full
  - food
---
- launchApp:
    clearState: false

# If we land signed-out (e.g. CI ran a sign-out flow before this one)
# bail with a clear failure so the runner sees what's happening.
- assertNotVisible:
    text: "Less thinking. More lifting."

# Navigate to Search tab. Tab labels are bottom-tab items so they
# match on the tab bar exactly.
- tapOn: "Search"
- assertVisible:
    text: "Search foods"
    timeout: 8000

- inputText: "oats"

# Wait for debounced search + at least one result row.
- assertVisible:
    text: ".*oats.*"
    timeout: 6000

# Tap the first matching row.
- tapOn:
    text: ".*oats.*"
    index: 0

# Add the food. The detail sheet has an "Add" CTA at the bottom.
- assertVisible: "Add"
- tapOn: "Add"

# Back to Diary. Confirm the food row appears in today's diary.
- tapOn: "Diary"
- assertVisible:
    text: ".*oats.*"
    timeout: 4000
