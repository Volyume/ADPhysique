# Account deletion path + the 30-day promise copy.
#
# Spec: TESTING_STRATEGY_LOCKED.md § E2E line 133
# "account_deletion_path.yaml -- delete flow + 30-day promise copy"
#
# The flow asserts:
#   1. The Delete account screen carries the locked 30-day promise
#      copy (`PRIVACY_CONSENT_LOCKED.md`).
#   2. Tapping through deletes the auth.users row + writes a row
#      to account_deletions_log (migration 039 audit trail).
#   3. The app lands back on the Welcome screen.

appId: app.volyume
tags:
  - full
  - privacy
  - account
---
- launchApp:
    clearState: false

# Navigate: You tab -> Settings -> Delete account.
- tapOn: "You"
- tapOn:
    text: "Settings"
    optional: true
- tapOn: "Delete account"

# Locked 30-day promise copy. The substring is the load-bearing
# part -- exact wording lives in PRIVACY_CONSENT_LOCKED.md.
- assertVisible:
    text: ".*30 days.*"

# Confirm field. The screen requires typing DELETE to enable the
# CTA (the typo-guard in SettingsScreen).
- tapOn:
    id: "delete-confirm-input"
    optional: true
- inputText: "DELETE"

- tapOn: "Delete account"

# Native confirm dialog ("Are you sure?" style).
- tapOn:
    text: "Delete"
    optional: true

# Lands back on Welcome.
- assertVisible:
    text: "Less thinking. More lifting."
    timeout: 20000
