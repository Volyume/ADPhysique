# Onboarding happy path: new sign-up -> Article 9 consent -> Train tab.
#
# Spec: TESTING_STRATEGY_LOCKED.md § E2E line 123
# "onboarding_happy_path.yaml -- new signup -> first run summary"
#
# Notes:
# - Uses a randomised email suffix so reruns don't collide with the
#   Supabase users table.
# - Article 9 consent is mandatory: the flow taps Continue, not the
#   "Decline" path (covered in onboarding_decline_article9.yaml).

appId: app.volyume
tags:
  - smoke
  - full
  - onboarding
---
- launchApp:
    clearState: true

# Welcome screen. New user picks the email path (the OAuth flows
# can't be driven from Maestro without a managed sandbox account).
- assertVisible: "Less thinking. More lifting."
- tapOn: "Sign in"

# LoginScreen. Toggle into sign-up mode.
- tapOn:
    text: "Sign up"
    index: 1
- assertVisible: "or with email"

- tapOn:
    text: "Email"
    optional: true
- tapOn:
    id: "email"
    optional: true
- inputText: "maestro+${output.timestamp}@volyume.test"

- tapOn:
    text: "Password"
    optional: true
- tapOn:
    id: "password"
    optional: true
- inputText: "MaestroTestPwd!1"

- tapOn: "Sign up"

# Onboarding sequence (per ONBOARDING_SEQUENCE_LOCKED.md). Several
# screens with goal / experience / equipment pickers. We accept
# defaults to keep the flow short; per-screen coverage lives in the
# dedicated onboarding flows.
- repeat:
    times: 12
    commands:
      - tapOn:
          text: "Continue"
          optional: true
      - tapOn:
          text: "Next"
          optional: true

# Article 9 consent screen. Tap the checkbox, then Continue.
- assertVisible: "Health and nutrition data consent"
- tapOn: "I understand"
- tapOn: "Continue"

# First-run summary lands on Train tab.
- assertVisible:
    text: "Train"
    timeout: 15000
