# Goal lock toggle (Move #2).
#
# Spec: TESTING_STRATEGY_LOCKED.md § E2E line 134
# "goal_lock_set_and_clear.yaml -- (move #2) goal lock toggle"
#
# Asserts the advanced-mode goal lock can be set and cleared from
# Settings, with the locked confirm copy + telemetry firing in the
# background (verified via the engine_telemetry queue, not the UI).

appId: app.volyume
tags:
  - full
  - engine
---
- launchApp:
    clearState: false

- tapOn: "You"
- tapOn:
    text: "Settings"
    optional: true
- tapOn: "Advanced"

# Goal lock row. The toggle plus its description live together.
- assertVisible:
    text: ".*Goal lock.*"
- tapOn: "Goal lock"

# Confirm modal -- per ONBOARDING_SEQUENCE_LOCKED.md the toggle
# carries an "I know what I'm doing" gate.
- assertVisible:
    text: ".*I understand.*"
- tapOn: "I understand"

# Toggle is now on. Re-tap to clear.
- tapOn: "Goal lock"

# Clear confirm.
- assertVisible:
    text: ".*Clear goal lock.*"
- tapOn:
    text: "Clear"
    optional: true
- tapOn:
    text: "OK"
    optional: true
