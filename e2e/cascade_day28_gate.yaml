# Cascade day-28 gate.
#
# Spec: TESTING_STRATEGY_LOCKED.md § E2E line 131
# "cascade_day28_gate.yaml -- (move #5) decisions at day 28"
#
# (After the 2026-05-23 2-tier override the cascade now runs to
# day 21, not day 28; renaming the file would orphan the spec link
# so we keep the filename and assert against the actual day-21
# gate. CURRENT_STATUS.md captures the override.)
#
# Status: SCAFFOLD. Same dependency as day14_skip: needs the
# cascade fast-forward hook.

appId: app.volyume
tags:
  - full
  - payments
---
- launchApp:
    clearState: false

# Day 21 = end of cascade, auto-downgrade fires.
- openLink: "volyume://test/cascade/day/21"

- assertVisible:
    text: "You're now on Free"
    timeout: 10000

# Acknowledge.
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "Got it"
    optional: true

# Confirm tier badge has flipped.
- assertVisible:
    text: "Free"
    timeout: 8000
