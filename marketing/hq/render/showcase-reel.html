<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<title>Volyume showcase reel</title>
<style>
@font-face {
  font-family: 'Schibsted Grotesk';
  font-weight: 400 800;
  font-style: normal;
  font-display: block;
  src: url('fonts/SchibstedGrotesk-Variable.woff2') format('woff2-variations');
}
@font-face {
  font-family: 'IBM Plex Mono';
  font-weight: 500;
  font-style: normal;
  font-display: block;
  src: url('fonts/IBMPlexMono-500.woff2') format('woff2');
}

:root {
  --canvas: #0D0D0D;
  --amber: #F5A623;
  --amber-fill: #E08C0B;
  --white: #FFFFFF;
  --muted: #9B9B9B;
  --font: 'Schibsted Grotesk', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { width: 1080px; height: 1920px; background: var(--canvas); overflow: hidden; }

#stage {
  position: relative;
  width: 1080px;
  height: 1920px;
  background: var(--canvas);
  overflow: hidden;
  font-family: var(--font);
}

/* Ambient amber depth behind everything. */
#glow {
  position: absolute;
  width: 1400px;
  height: 1400px;
  left: 50%;
  top: 40%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(245,166,35,0.22) 0%, rgba(245,166,35,0.07) 34%, rgba(13,13,13,0) 62%);
  transform: translate(-50%, -50%);
  filter: blur(20px);
  will-change: transform, opacity;
}

/* Fine film grain for texture (static SVG noise, cheap to reuse per frame). */
#grain {
  position: absolute;
  inset: 0;
  opacity: 0.05;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size: 320px 320px;
  pointer-events: none;
}

/* A faint vignette to seat the content. */
#vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 45%, rgba(13,13,13,0) 45%, rgba(13,13,13,0.75) 100%);
  pointer-events: none;
}

#wordmark {
  position: absolute;
  top: 84px;
  left: 88px;
  display: flex;
  align-items: center;
  gap: 18px;
  will-change: opacity, transform;
}
#wordmark .mark {
  width: 60px;
  height: 60px;
  border-radius: 16px;
  background: #000;
  border: 2px solid rgba(245,166,35,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 40px;
  color: var(--amber);
  line-height: 1;
}
#wordmark .type {
  font-weight: 700;
  font-size: 40px;
  letter-spacing: 6px;
  color: var(--white);
}

.layer { position: absolute; inset: 0; will-change: opacity, transform; }

/* ---- Headline (hook) ---- */
#hook {
  position: absolute;
  left: 88px;
  top: 560px;
  width: 900px;
}
.hline {
  font-weight: 800;
  font-size: 148px;
  line-height: 0.98;
  letter-spacing: -3px;
  color: var(--white);
  will-change: opacity, transform, filter;
}
.hline.amber { color: var(--amber); }
#hook .sub {
  margin-top: 44px;
  font-weight: 500;
  font-size: 46px;
  line-height: 1.28;
  color: var(--muted);
  max-width: 760px;
  will-change: opacity, transform;
}

/* ---- Phone mockups ---- */
.phone {
  position: absolute;
  width: 540px;
  height: 1058px;
  border-radius: 60px;
  background: #050505;
  padding: 13px;
  box-shadow: 0 60px 130px rgba(0,0,0,0.72), 0 0 0 2px #1b1b19, inset 0 0 0 1px rgba(255,255,255,0.04);
  will-change: transform, opacity;
}
.phone::before { /* amber depth glow hugging the device */
  content: '';
  position: absolute;
  inset: -40px;
  border-radius: 90px;
  background: radial-gradient(closest-side, rgba(245,166,35,0.28), rgba(245,166,35,0) 78%);
  filter: blur(14px);
  z-index: -1;
}
.phone img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 48px;
  display: block;
}
.phone .glare { /* moving light sweep across the screen */
  position: absolute;
  inset: 13px;
  border-radius: 48px;
  overflow: hidden;
  pointer-events: none;
}
.phone .glare::after {
  content: '';
  position: absolute;
  top: -20%;
  left: -60%;
  width: 60%;
  height: 140%;
  background: linear-gradient(105deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.16) 50%, rgba(255,255,255,0) 100%);
  transform: translateX(var(--sweep, -200%)) rotate(4deg);
}

/* ---- caption chip above/below a phone ---- */
.cap {
  position: absolute;
  left: 88px;
  width: 904px;
  will-change: opacity, transform;
}
.cap .eyebrow {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 26px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--amber);
  margin-bottom: 20px;
}
.cap .big {
  font-weight: 700;
  font-size: 74px;
  line-height: 1.04;
  letter-spacing: -1.5px;
  color: var(--white);
}

/* ---- pills row (Train / Eat / Check in) ---- */
#pills {
  position: absolute;
  left: 88px;
  top: 1240px;
  display: flex;
  gap: 22px;
  will-change: opacity, transform;
}
.pill {
  border: 2px solid rgba(245,166,35,0.6);
  border-radius: 999px;
  padding: 20px 34px;
  font-weight: 700;
  font-size: 38px;
  color: var(--white);
  display: flex;
  align-items: center;
  gap: 14px;
  background: rgba(245,166,35,0.06);
}
.pill .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--amber); }

/* ---- decision beat ---- */
#decide { position: absolute; left: 88px; top: 640px; width: 904px; }
#decide .d1 {
  font-weight: 800;
  font-size: 128px;
  line-height: 1.0;
  letter-spacing: -3px;
  color: var(--white);
  will-change: opacity, transform;
}
#decide .d1 .or { color: var(--amber); }
#decide .d2 {
  margin-top: 40px;
  font-weight: 500;
  font-size: 52px;
  line-height: 1.25;
  color: var(--muted);
  will-change: opacity, transform;
}

/* ---- CTA end card ---- */
#cta {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 40px;
  will-change: opacity;
}
#cta .logo {
  width: 168px;
  height: 168px;
  border-radius: 40px;
  background: #000;
  border: 3px solid rgba(245,166,35,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 104px;
  color: var(--amber);
  will-change: transform, opacity;
}
#cta .name {
  font-weight: 800;
  font-size: 96px;
  letter-spacing: 8px;
  color: var(--white);
}
#cta .play {
  display: flex;
  align-items: center;
  gap: 18px;
  border: 2px solid rgba(255,255,255,0.25);
  border-radius: 999px;
  padding: 22px 40px;
  font-weight: 700;
  font-size: 42px;
  color: var(--white);
}
#cta .play .tri {
  width: 0; height: 0;
  border-left: 30px solid var(--amber);
  border-top: 19px solid transparent;
  border-bottom: 19px solid transparent;
}
#cta .fine {
  margin-top: 8px;
  font-weight: 500;
  font-size: 34px;
  color: var(--muted);
  text-align: center;
  max-width: 820px;
  line-height: 1.3;
}
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* ------------ maths helpers (pure functions of time) ------------ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
// normalised progress of t within [start,end], clamped 0..1
const seg = (t, start, end) => clamp((t - start) / (end - start), 0, 1);
const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const easeInOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

const SHOTS = 'assets/screenshots/';
let DURATION = 18600;
let nodes = {};

function build() {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';

  stage.appendChild(el('div', null)).id = 'glow';
  nodes.glow = stage.querySelector('#glow');

  // wordmark
  const wm = el('div');
  wm.id = 'wordmark';
  wm.appendChild(el('div', 'mark', 'V'));
  wm.appendChild(el('div', 'type', 'VOLYUME'));
  stage.appendChild(wm);
  nodes.wordmark = wm;

  // hook
  const hook = el('div'); hook.id = 'hook';
  const h1 = el('div', 'hline', 'Less thinking.');
  const h2 = el('div', 'hline amber', 'More lifting.');
  const sub = el('div', 'sub', 'Training, nutrition and your weekly check-in, in one connected loop.');
  hook.append(h1, h2, sub);
  stage.appendChild(hook);
  nodes.hook = hook; nodes.h1 = h1; nodes.h2 = h2; nodes.sub = sub;

  // phone Train
  nodes.phoneTrain = phone(SHOTS + '03_plan_that_moves_with_you.jpg');
  stage.appendChild(nodes.phoneTrain);
  // phone Eat
  nodes.phoneEat = phone(SHOTS + '06_meals_planned_to_your_targets.jpg');
  stage.appendChild(nodes.phoneEat);

  // caption B
  nodes.capB = caption('IT READS YOUR WHOLE WEEK', 'Your training and your food, logged in one place.');
  stage.appendChild(nodes.capB);
  // pills
  const pills = el('div'); pills.id = 'pills';
  pills.append(pill('Train'), pill('Eat'), pill('Check in'));
  stage.appendChild(pills);
  nodes.pills = pills;

  // decision beat
  const decide = el('div'); decide.id = 'decide';
  const d1 = el('div', 'd1', 'Change, <span class="or">or hold.</span>');
  const d2 = el('div', 'd2', 'Every week it makes the call from your own data, and shows you why.');
  decide.append(d1, d2);
  stage.appendChild(decide);
  nodes.decide = decide; nodes.d1 = d1; nodes.d2 = d2;

  // CTA
  const cta = el('div'); cta.id = 'cta';
  const logo = el('div', 'logo', 'V');
  const name = el('div', 'name', 'VOLYUME');
  const play = el('div', 'play');
  play.append(el('div', 'tri'), el('span', null, 'Live on Google Play'));
  const fine = el('div', 'fine', 'Free to start. The weekly coaching and food diary are Pro.');
  cta.append(logo, name, play, fine);
  stage.appendChild(cta);
  nodes.cta = cta; nodes.ctaLogo = logo;

  // overlays on top
  stage.appendChild(el('div', null)).id = 'vignette';
  stage.appendChild(el('div', null)).id = 'grain';
}

function phone(src) {
  const p = el('div', 'phone');
  const img = document.createElement('img');
  img.src = src;
  p.appendChild(img);
  p.appendChild(el('div', 'glare'));
  return p;
}
function caption(eyebrow, big) {
  const c = el('div', 'cap');
  c.append(el('div', 'eyebrow', eyebrow), el('div', 'big', big));
  return c;
}
function pill(label) {
  const p = el('div', 'pill');
  p.append(el('div', 'dot'), el('span', null, label));
  return p;
}

function set(node, { o = 1, x = 0, y = 0, s = 1, blur = 0, rot = 0 } = {}) {
  node.style.opacity = o;
  let tr = `translate(${x}px, ${y}px)`;
  if (s !== 1) tr += ` scale(${s})`;
  if (rot) tr += ` rotate(${rot}deg)`;
  node.style.transform = tr;
  node.style.filter = blur ? `blur(${blur}px)` : 'none';
}

/* ------------ the storyboard: every element's state as a pure function of t ------------ */
function seek(t) {
  // continuous ambient motion
  const drift = Math.sin(t / 2600);
  const drift2 = Math.cos(t / 3400);
  set(nodes.glow, { o: 1, x: drift * 60, y: drift2 * 40, s: lerp(0.94, 1.06, (Math.sin(t / 3000) + 1) / 2) });

  // wordmark: fades in, stays, fades out on CTA
  const wmIn = easeOutCubic(seg(t, 200, 900));
  const wmOut = 1 - seg(t, 14300, 14800);
  set(nodes.wordmark, { o: wmIn * wmOut, y: lerp(-20, 0, wmIn) });

  /* Scene A — hook 0..3600 */
  const aOut = 1 - easeInOutCubic(seg(t, 3100, 3700)); // whole hook leaves
  const h1p = easeOutCubic(seg(t, 350, 1150));
  const h2p = easeOutCubic(seg(t, 700, 1550));
  const subp = easeOutCubic(seg(t, 1250, 2000));
  set(nodes.hook, { o: aOut, y: lerp(0, -70, 1 - aOut) });
  set(nodes.h1, { o: h1p, y: lerp(70, 0, h1p), blur: lerp(10, 0, h1p) });
  set(nodes.h2, { o: h2p, y: lerp(70, 0, h2p), blur: lerp(10, 0, h2p) });
  set(nodes.sub, { o: subp, y: lerp(40, 0, subp) });

  /* Scene B — phone Train 3400..8000 */
  const bIn = easeOutCubic(seg(t, 3500, 4300));
  const bOut = 1 - easeInOutCubic(seg(t, 7500, 8100));
  const floatB = Math.sin((t - 3500) / 1500) * 14;
  // enters bottom-right, drifts to a hero position, then slides left as Eat comes in
  const bShiftLeft = easeInOutCubic(seg(t, 7000, 8100)) * -560;
  set(nodes.phoneTrain, {
    o: bIn * bOut,
    x: lerp(150, 300, bIn) + bShiftLeft,
    y: lerp(760, 470, bIn) + floatB,
    s: lerp(0.9, 1, bIn),
    rot: lerp(4, 1.5, bIn),
  });
  // glare sweep once around 4.6s
  const sweep = seg(t, 4500, 5400);
  nodes.phoneTrain.querySelector('.glare').style.setProperty('--sweep', `${lerp(-200, 260, sweep)}%`);
  // caption B (paired with Train)
  const capBIn = easeOutCubic(seg(t, 4100, 4800));
  const capBOut = 1 - seg(t, 7100, 7600);
  set(nodes.capB, { o: capBIn * capBOut, y: lerp(150, 96, capBIn) });
  nodes.capB.style.top = '150px';
  // pills fade with Train scene
  const pillsIn = easeOutCubic(seg(t, 5200, 6000));
  const pillsOut = 1 - seg(t, 7100, 7600);
  set(nodes.pills, { o: pillsIn * pillsOut, y: lerp(40, 0, pillsIn) });

  /* Scene C — phone Eat 7600..11400 */
  const cIn = easeOutCubic(seg(t, 7700, 8500));
  const cOut = 1 - easeInOutCubic(seg(t, 10900, 11500));
  const floatC = Math.sin((t - 7700) / 1500) * 14;
  set(nodes.phoneEat, {
    o: cIn * cOut,
    x: lerp(620, 250, cIn),
    y: lerp(560, 470, cIn) + floatC,
    s: lerp(0.9, 1, cIn),
    rot: lerp(-4, -1.5, cIn),
  });
  const sweepC = seg(t, 8700, 9600);
  nodes.phoneEat.querySelector('.glare').style.setProperty('--sweep', `${lerp(-200, 260, sweepC)}%`);

  /* Scene D — decision 11400..15000 */
  const dIn = easeOutCubic(seg(t, 11600, 12300));
  const dOut = 1 - easeInOutCubic(seg(t, 14300, 14900));
  const d1p = easeOutCubic(seg(t, 11700, 12500));
  const d2p = easeOutCubic(seg(t, 12300, 13100));
  set(nodes.decide, { o: dOut });
  set(nodes.d1, { o: d1p * dIn, y: lerp(60, 0, d1p) });
  set(nodes.d2, { o: d2p, y: lerp(40, 0, d2p) });

  /* Scene E — CTA 14900..18600 */
  const eIn = easeOutCubic(seg(t, 15000, 15700));
  const logoPop = easeOutBack(seg(t, 15100, 15900));
  set(nodes.cta, { o: eIn });
  set(nodes.ctaLogo, { o: eIn, s: lerp(0.6, 1, logoPop) });

  // hide phones/decision hard once fully out to avoid stray pixels
  if (t > 11600) { nodes.phoneTrain.style.opacity = 0; }
}

window.__loadReel = function () {
  build();
  seek(0);
  return DURATION;
};
window.__seek = function (t) { seek(t); };
</script>
</body>
</html>
