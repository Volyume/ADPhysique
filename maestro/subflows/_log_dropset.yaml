# Switches set type to Drop Set and completes one set.
# A drop set counts toward the working set total (setType !== 'warmup').
# Pre-condition: volyume-btn-complete-set is the current primary CTA.
# Post-condition: one drop-set logged; working set count incremented by 1.
- tapOn:
    id: volyume-set-type-btn
- extendedWaitUntil:
    visible:
      text: "Drop Set"
    timeout: 4000
- tapOn:
    text: "Drop Set"
- tapOn:
    id: volyume-weight-input
- clearText
- inputText: "60"
- tapOn:
    id: volyume-reps-input
- clearText
- inputText: "12"
- tapOn:
    id: volyume-btn-complete-set
- waitForAnimationToEnd
