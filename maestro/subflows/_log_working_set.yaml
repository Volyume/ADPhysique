# Explicitly switches set type to Working (straight) and completes one set.
# Switching explicitly is required because the previous set type persists in state
# (e.g. after a warm-up set, the picker still shows Warm-up).
# Pre-condition: volyume-btn-complete-set is the current primary CTA.
# Post-condition: one working set logged; working set count incremented by 1.
- tapOn:
    id: volyume-set-type-btn
- extendedWaitUntil:
    visible:
      text: "Working"
    timeout: 4000
- tapOn:
    text: "Working"
- tapOn:
    id: volyume-weight-input
- clearText
- inputText: "80"
- tapOn:
    id: volyume-reps-input
- clearText
- inputText: "10"
- tapOn:
    id: volyume-btn-complete-set
- waitForAnimationToEnd
