# Clears all app state and logs in as a local user (no account required).
# Called at the start of every flow to guarantee a clean, deterministic baseline.
- launchApp:
    appId: app.volyume
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Continue without an account"
    timeout: 15000
- tapOn:
    text: "Continue without an account"
- extendedWaitUntil:
    visible:
      text: "VOLYUME"
    timeout: 12000
