name: Apply Supabase migrations

# MANUAL DISPATCH ONLY. Nothing here runs on a push or a merge. (Header
# corrected 2026-08-10, Campaign 4 review: it used to open "Auto-applies the
# supabase/migrate_*.sql files ... so migrations never need pasting into the
# SQL Editor by hand", written under the 2026-06-06 founder direction "I do
# not deploy anything". That trigger was retired at E0 - see the note above
# `on:` below - and CLAUDE.md § 2 now states cloud migrations are applied
# deliberately, gated on the founder's exact phrase "run against production".
# Merging a migration to main does NOT apply it.)
#
# What the job does WHEN A HUMAN DISPATCHES IT:
#
#   * A tracking table (claude_schema_migrations) records what has run, so each
#     file applies at most once. Re-running the workflow is a no-op.
#   * A baseline seed marks every migration numbered <= 058 as already applied
#     (they were applied historically, per supabase/README.md), so they are
#     never re-run against the live DB.
#   * A skip list (049, 059) is never applied by this workflow. 049 is still
#     HELD and destructive - do not apply it by any route. 059 is NO LONGER
#     held: it was applied to production in the 2026-07-27 sweep, so its
#     presence in the list is now only belt-and-braces (supabase/README.md
#     § CURRENT STATUS).
#   * Each file runs in a single transaction with ON_ERROR_STOP, so a failure
#     rolls back and fails the run loudly rather than half-applying.
#
# One-time secret (already configured per founder, 2026-06-06):
#   SUPABASE_DB_URL = the project's Postgres connection string
#     (Supabase dashboard -> Project Settings -> Database -> Connection string,
#     URI form, including the password). If your DB secret has a different name,
#     point it at SUPABASE_DB_URL or tell me the name and I'll update this file.

# E0 closure (v3 programme, founder decision): cloud migrations are
# founder-applied manually. The push trigger is retired; manual dispatch
# remains as an optional founder-run tool only.
on:
  workflow_dispatch:

# GitHub forces JavaScript actions onto Node 24 on 2026-06-16. Opt in early so
# CI proves Node 24 compatibility on our schedule, not on the forced flag day.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check required secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is empty. Add it in repo Settings -> Secrets and variables -> Actions (Supabase dashboard -> Project Settings -> Database -> Connection string, URI form with password)."
            exit 1
          fi

      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          run_sql() { psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tA -c "$1"; }

          echo "Ensuring tracking table…"
          run_sql "CREATE TABLE IF NOT EXISTS claude_schema_migrations (filename text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now());"

          echo "Seeding the applied baseline (migrations <= 058 are already live)…"
          for f in $(ls supabase/migrate_*.sql | sort); do
            base="$(basename "$f")"
            num="$(echo "$base" | sed -E 's/migrate_0*([0-9]+)_.*/\1/')"
            if [ "$num" -le 58 ]; then
              run_sql "INSERT INTO claude_schema_migrations(filename) VALUES ('$base') ON CONFLICT DO NOTHING;" >/dev/null
            fi
          done

          applied_any=0
          for f in $(ls supabase/migrate_*.sql | sort); do
            base="$(basename "$f")"
            case "$base" in
              migrate_049_*|migrate_059_*)
                echo "HELD, skipping $base (ships with an app build)"; continue;;
            esac
            seen="$(run_sql "SELECT 1 FROM claude_schema_migrations WHERE filename='$base';")"
            if [ "$seen" = "1" ]; then continue; fi
            echo "Applying $base …"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$f"
            run_sql "INSERT INTO claude_schema_migrations(filename) VALUES ('$base') ON CONFLICT DO NOTHING;" >/dev/null
            applied_any=1
            echo "Applied $base"
          done

          if [ "$applied_any" = "0" ]; then
            echo "No pending migrations to apply."
          fi

          echo "Verifying application function owner/default-ACL contract…"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/verify_application_function_acl.sql
