name: EAS Build

on:
  push:
    branches:
      - claude/build-volyume-app-srY9C
  workflow_dispatch:

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify Expo auth
        run: eas whoami

      - name: Create or link EAS project
        run: eas init --non-interactive --force || true

      - name: Build Android
        run: eas build --platform android --profile preview --clear-cache --non-interactive --no-wait
