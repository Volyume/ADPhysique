name: Build VOLYUME Pulse Android APK

# Builds a directly-installable Android APK for the private VOLYUME Pulse app
# (whoop-companion/) with ZERO account setup — no Expo login, no eas init, no
# Apple, no Play Store. It runs `expo prebuild` then Gradle `assembleRelease`
# (Expo's template signs release with the debug keystore, so the APK installs on
# any device for personal use), and uploads the APK as a workflow artifact.
#
# Runs automatically on every push to this branch that touches the app (a manual
# "Run workflow" button can't appear because that requires the file to be on the
# default branch, and we never touch main). To get the APK: Actions tab → open the
# latest "Build VOLYUME Pulse Android APK" run → Artifacts → download
# "volyume-pulse-apk" → install on your phone (allow "install unknown apps").
#
# Free GitHub-hosted runner; no repo secrets required.

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'whoop-companion/**'
      - '.github/workflows/build-whoop-android.yml'
  workflow_dispatch:

concurrency:
  group: whoop-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: whoop-companion

jobs:
  build:
    name: Prebuild + Gradle assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --no-install

      # Independence guard: the generated app MUST be VOLYUME Pulse, never the
      # VOLYUME app. If autolinking/config ever cross-links the parent project,
      # the applicationId would be app.volyume and the APK would clash with the
      # VOLYUME already on the phone (signature mismatch -> install fails). Fail
      # the build here instead of shipping a broken APK.
      - name: Confirm app identity
        working-directory: whoop-companion/android
        run: |
          APPID=$(grep -m1 'applicationId' app/build.gradle | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          NAME=$(grep -m1 'app_name' app/src/main/res/values/strings.xml | sed -E 's/.*>([^<]*)<.*/\1/')
          echo "applicationId: $APPID"
          echo "app_name:      $NAME"
          if [ "$APPID" != "app.volyume.pulse" ]; then
            echo "::error::Built applicationId is '$APPID', expected 'app.volyume.pulse'. Refusing to build the wrong app (would clash with VOLYUME)."
            exit 1
          fi
          echo "✓ Independent build confirmed: VOLYUME Pulse (app.volyume.pulse)"

      - name: Gradle assembleRelease
        working-directory: whoop-companion/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: volyume-pulse-apk
          path: whoop-companion/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
