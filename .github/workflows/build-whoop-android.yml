name: Build VOLYUME Pulse Android APK

# Builds a directly-installable Android APK for the private VOLYUME Pulse app
# (whoop-companion/) with ZERO account setup — no Expo login, no eas init, no
# Apple, no Play Store. It runs `expo prebuild` then Gradle `assembleRelease`
# (Expo's template signs release with the debug keystore, so the APK installs on
# any device for personal use), and uploads the APK as a workflow artifact.
#
# To get the APK: Actions tab → "Build VOLYUME Pulse Android APK" → Run workflow →
# open the finished run → Artifacts → download "volyume-pulse-apk" → install on your
# phone (you'll need to allow "install unknown apps" for your browser/files app).
#
# Free GitHub-hosted runner; no repo secrets required.

on:
  workflow_dispatch:

concurrency:
  group: whoop-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: whoop-companion

jobs:
  build:
    name: Prebuild + Gradle assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --no-install

      - name: Gradle assembleRelease
        working-directory: whoop-companion/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: volyume-pulse-apk
          path: whoop-companion/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
