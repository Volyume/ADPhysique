name: Deploy public/ to GitHub Pages

# Re-trigger after lifting the github-pages environment branch restriction.

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'public/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# GitHub forces JavaScript actions onto Node 24 on 2026-06-16. Opt in early so
# CI proves Node 24 compatibility on our schedule, not on the forced flag day.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Inject the Android App Links fingerprints into assetlinks.json at deploy
      # time so the served file at volyume.app/.well-known/assetlinks.json carries
      # real values, while the committed file stays a placeholder template. The
      # upload-key SHA-256 is derived here from the same keystore the build signs
      # with (no keytool on anyone's machine). The Play App Signing key SHA-256 is
      # read once from Play Console and pasted into the PLAY_APP_SIGNING_SHA256
      # repo secret. With neither secret set, the placeholders are left as-is and
      # a warning is logged.
      - name: Inject assetlinks fingerprints
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PLAY_APP_SIGNING_SHA256: ${{ secrets.PLAY_APP_SIGNING_SHA256 }}
        run: |
          set -e
          UPLOAD_SHA256=""
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/upload.keystore
            UPLOAD_SHA256=$(keytool -list -v -keystore /tmp/upload.keystore \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
              | grep -E 'SHA256:' | head -1 | awk '{print $2}')
          fi
          python3 - public/.well-known/assetlinks.json "$PLAY_APP_SIGNING_SHA256" "$UPLOAD_SHA256" <<'PY'
          import json, sys
          path, play, upload = sys.argv[1], sys.argv[2].strip(), sys.argv[3].strip()
          data = json.load(open(path))
          out = []
          for v in (play, upload):
              if v and v not in out:
                  out.append(v)
          # Preserve any already-real fingerprints, drop the placeholders.
          for f in data[0]["target"]["sha256_cert_fingerprints"]:
              if f.startswith("REPLACE_WITH"):
                  continue
              if f not in out:
                  out.append(f)
          if out:
              data[0]["target"]["sha256_cert_fingerprints"] = out
              json.dump(data, open(path, "w"), indent=2)
              print("assetlinks fingerprints injected:", out)
          else:
              print("::warning::No assetlinks fingerprints available. Set PLAY_APP_SIGNING_SHA256 (and the keystore secrets) so https://volyume.app App Links verify.")
          PY

      # Inject the Apple Team ID into the AASA at deploy time so the served file
      # at volyume.app/.well-known/apple-app-site-association carries the real
      # appID, while the committed file stays a placeholder template (mirrors the
      # assetlinks injection above). Set the APPLE_TEAM_ID repo secret to your
      # 10-character Apple Developer Team ID. With it unset, the placeholder is
      # left as-is and a warning is logged.
      - name: Inject Apple Team ID into AASA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          python3 - public/.well-known/apple-app-site-association "$APPLE_TEAM_ID" <<'PY'
          import json, sys
          path, team = sys.argv[1], sys.argv[2].strip()
          data = json.load(open(path))
          if not team:
              print("::warning::APPLE_TEAM_ID not set; iOS Universal Links will not verify until volyume.app/.well-known/apple-app-site-association carries a real appID.")
              sys.exit(0)
          changed = False
          for d in data["applinks"]["details"]:
              if d.get("appID", "").startswith("REPLACE_WITH_APPLE_TEAM_ID"):
                  d["appID"] = d["appID"].replace("REPLACE_WITH_APPLE_TEAM_ID", team)
                  changed = True
          if changed:
              json.dump(data, open(path, "w"), indent=2)
              print("AASA appID injected for team", team)
          PY

      - name: Upload public/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
