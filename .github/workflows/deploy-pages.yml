name: Deploy public/ to GitHub Pages

# Re-trigger after lifting the github-pages environment branch restriction.

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'public/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# GitHub forces JavaScript actions onto Node 24 on 2026-06-16. Opt in early so
# CI proves Node 24 compatibility on our schedule, not on the forced flag day.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Inject the Android App Links fingerprints into assetlinks.json at deploy
      # time so the served file at volyume.app/.well-known/assetlinks.json carries
      # real values, while the committed file stays a placeholder template. The
      # upload-key SHA-256 is derived here from the same keystore the build signs
      # with (no keytool on anyone's machine). The Play App Signing key SHA-256 is
      # read once from Play Console and pasted into the PLAY_APP_SIGNING_SHA256
      # repo secret. With neither secret set, the placeholders are left as-is and
      # a warning is logged.
      - name: Inject assetlinks fingerprints
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PLAY_APP_SIGNING_SHA256: ${{ secrets.PLAY_APP_SIGNING_SHA256 }}
        run: |
          set -e
          UPLOAD_SHA256=""
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/upload.keystore
            UPLOAD_SHA256=$(keytool -list -v -keystore /tmp/upload.keystore \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
              | grep -E 'SHA256:' | head -1 | awk '{print $2}')
          fi
          python3 - public/.well-known/assetlinks.json "$PLAY_APP_SIGNING_SHA256" "$UPLOAD_SHA256" <<'PY'
          import json, sys
          path, play, upload = sys.argv[1], sys.argv[2].strip(), sys.argv[3].strip()
          data = json.load(open(path))
          out = []
          for v in (play, upload):
              if v and v not in out:
                  out.append(v)
          # Preserve any already-real fingerprints, drop the placeholders.
          for f in data[0]["target"]["sha256_cert_fingerprints"]:
              if f.startswith("REPLACE_WITH"):
                  continue
              if f not in out:
                  out.append(f)
          if out:
              data[0]["target"]["sha256_cert_fingerprints"] = out
              json.dump(data, open(path, "w"), indent=2)
              print("assetlinks fingerprints injected:", out)
          else:
              print("::warning::No assetlinks fingerprints available. Set PLAY_APP_SIGNING_SHA256 (and the keystore secrets) so https://volyume.app App Links verify.")
          PY

      # Fail-closed guard (Codex audit AC-18/BW-02): never publish a well-known
      # file that still carries a REPLACE_WITH_* placeholder. assetlinks.json is
      # injected above from secrets; apple-app-site-association carries the real
      # Apple Team ID committed in-repo. If either still shows a placeholder at
      # deploy time (e.g. a missing Android signing secret), the served App
      # Links / Universal Links silently break -- so fail the deploy instead of
      # shipping a broken association file. Last good deploy stays live.
      - name: Fail if any well-known placeholder survives
        run: |
          # Only the served association files matter here -- README.md documents
          # the placeholders and must be ignored. assetlinks.json has already
          # been rewritten with real fingerprints by the injection step above;
          # apple-app-site-association carries the real Team ID committed in-repo.
          FILES="public/.well-known/assetlinks.json public/.well-known/apple-app-site-association"
          if grep -n 'REPLACE_WITH' $FILES; then
            echo "::error::A served well-known association file still contains a REPLACE_WITH placeholder. \
          For assetlinks.json set the Android signing secrets (PLAY_APP_SIGNING_SHA256 + keystore); \
          for apple-app-site-association commit the real Apple Team ID. Refusing to publish a broken association file."
            exit 1
          fi
          echo "No placeholders in the served association files -- safe to publish."

      - name: Upload public/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
