name: Identity invariant

# Enforces the IDENTITY_AND_OWNERSHIP_LOCKED.md hard rule: no code may
# mutate a row's user_id at runtime. The only legal exceptions are
# the one-shot column backfills in database.js (annotated LOCKED-OK).
#
# scripts/check-identity-invariant.sh exits 1 on any unannotated
# `SET user_id` in src/. This workflow is the CI half referenced by
# CLAUDE.md ("CI grep enforces this").

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

# Explicit minimal permissions per Codex re-audit 2026-05-26 finding
# #5: run #12 failed at actions/checkout with HTTP 403. The default
# permissions in some org / branch-protection setups deny contents
# read; declaring the minimum required surface avoids the 403.
permissions:
  contents: read

# GitHub forces JavaScript actions onto Node 24 on 2026-06-16. Opt in early so
# CI proves Node 24 compatibility on our schedule, not on the forced flag day.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: Check identity invariant
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run identity invariant check
        run: ./scripts/check-identity-invariant.sh
