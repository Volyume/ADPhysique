name: Build Android (APK + AAB, signed)

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
      - '.ci-status/**'
  workflow_dispatch:
    inputs:
      architectures:
        description: 'ABIs to build (Play release needs armeabi-v7a,arm64-v8a)'
        default: 'armeabi-v7a,arm64-v8a'
        required: false

# One Android build per branch at a time. A new push cancels an
# in-flight run on the same ref, so a stuck or superseded build does
# not sit on a runner for the full 6h default timeout.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Needed so the "Publish build status" step can push a small status
# file back to the same branch. The auto-commit uses [skip ci] in the
# message so it doesn't trigger another run.
permissions:
  contents: write

# GitHub forces JavaScript actions onto Node 24 on 2026-06-16. Opt in early so
# CI proves Node 24 compatibility on our schedule, not on the forced flag day.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # main (the release line) and manual runs build the full Play-ready ABI set;
  # claude/** branch pushes stay on a single fast ABI for the compile-check.
  REACT_NATIVE_ARCHITECTURES: ${{ github.event.inputs.architectures || (github.ref == 'refs/heads/main' && 'armeabi-v7a,arm64-v8a' || 'arm64-v8a') }}

jobs:
  build:
    name: Build Release APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Free disk space before the build. The release build (assembleRelease +
      # bundleRelease for all ABIs, plus the react-native-skia native libs and
      # the release lint-vital pass) sits close to the runner's disk ceiling,
      # and the restored Gradle cache grows each run. A run failed with two
      # "No space left on device" errors, at
      # :shopify_react-native-skia:copyReleaseJniLibsProjectOnly (copying
      # librnskia.so) and :expo:lintVitalAnalyzeRelease (executionHistory.bin),
      # after all 1683 tasks had executed; the Gradle daemon then died ("Could
      # not receive a message from the daemon"). Removing the large preinstalled
      # toolchains we never use (dotnet, Haskell/ghc, Swift, PowerShell) and
      # pruning docker images frees ~12-15GB. The Android SDK/NDK are left
      # untouched because the native modules need them to compile.
      - name: Free disk space
        run: |
          echo "--- disk before cleanup ---"; df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium /usr/local/share/vcpkg || true
          docker image prune --all --force || true
          echo "--- disk after cleanup ---"; df -h /

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        # npm ci so future package-lock.json drift fails CI loudly
        # instead of being silently papered over by 'npm install'.
        # Codex audit 2026-05-26 F11.
        run: npm ci --legacy-peer-deps

      # This workflow is the artifact builder. Main CI owns Jest, lint,
      # type-checking, Expo Doctor, and dependency audit so a transient or
      # unrelated JS quality failure does not block branch APK/AAB delivery for
      # device testing. The native build below still fails on real compile,
      # signing, packaging, or compatibility errors.

      # Fail loudly if backend credentials aren't set. Without these, Metro
      # bundles empty strings and the app crashes at first launch with
      # "Error: supabaseUrl is required." — a silent config bug that has
      # bitten us once already. Prints the length (not the value) so we
      # can sanity-check from the log that the secret is reaching the
      # workflow and is the expected size.
      - name: Verify required secrets are set
        id: verify
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          URL_LEN=${#EXPO_PUBLIC_SUPABASE_URL}
          KEY_LEN=${#EXPO_PUBLIC_SUPABASE_ANON_KEY}
          echo "EXPO_PUBLIC_SUPABASE_URL length: $URL_LEN"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY length: $KEY_LEN"
          # Expose to subsequent steps + the publish-status step so the
          # diagnostic ends up in .ci-status/latest.md even if the build
          # later fails.
          echo "url_len=$URL_LEN" >> "$GITHUB_OUTPUT"
          echo "key_len=$KEY_LEN" >> "$GITHUB_OUTPUT"
          # A typical Supabase URL is ~40 chars (https://<20-char-id>.supabase.co)
          # A typical anon key is ~220 chars (JWT with three base64 segments).
          if [ "$URL_LEN" -eq 0 ]; then
            echo "::error::EXPO_PUBLIC_SUPABASE_URL secret is empty. Re-paste the value in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ "$URL_LEN" -lt 20 ] || [ "$URL_LEN" -gt 100 ]; then
            echo "::warning::EXPO_PUBLIC_SUPABASE_URL length looks wrong ($URL_LEN chars). Expected ~40 chars like https://abcdef.supabase.co"
          fi
          if [ "$KEY_LEN" -eq 0 ]; then
            echo "::error::EXPO_PUBLIC_SUPABASE_ANON_KEY secret is empty. Re-paste the value in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ "$KEY_LEN" -lt 100 ]; then
            echo "::warning::EXPO_PUBLIC_SUPABASE_ANON_KEY length looks wrong ($KEY_LEN chars). Expected ~220 chars (JWT starting with eyJ)."
          fi
          echo "✓ Supabase credentials present"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # API 35 (Android 15) is now the Play Store minimum target. Make sure the
      # platform and build-tools the build compiles against are installed, so
      # the Gradle build doesn't fail on a missing SDK component.
      - name: Install Android SDK 35 + build-tools 35
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null || true
          echo "✓ Requested platforms;android-35 and build-tools;35.0.0"

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_USDA_API_KEY: ${{ secrets.EXPO_PUBLIC_USDA_API_KEY }}
          # Sentry source-map upload. When the SENTRY_AUTH_TOKEN repo secret is
          # set, the gradle bundle step (below) uploads Hermes source maps so
          # production stack traces symbolicate. When it is absent (e.g. a fork
          # or a branch without the secret), upload auto-disables so the build
          # still succeeds. The token is also needed here so the Sentry Expo
          # plugin configures consistently during prebuild.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN != '' && 'false' || 'true' }}

      # Raise the Gradle JVM heap for the release build. The last build
      # (run failed with "Execution failed for task
      # ':app:collectReleaseDependencies' > Java heap space") OOM'd at the
      # default ~2g the prebuild template writes. This must run AFTER
      # `expo prebuild --clean`, which regenerates android/ from scratch
      # and wipes any earlier gradle.properties. Appending is safe: a
      # later org.gradle.jvmargs line wins over the template's.
      - name: Raise Gradle heap for the release build
        run: |
          echo "org.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "--- gradle.properties org.gradle lines ---"
          grep '^org.gradle' android/gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # Expo SDK 54 / RN 0.81 ships the correct Gradle (8.13) and AGP, and
      # includes the upstream fixes that previously needed patching here on
      # SDK 51 / RN 0.74: the Gradle 8.9 pin, the AGP 8.6.0 force, the
      # expo-modules-core `components.release` and `serviceOf` edits, the
      # compileSdk-35 nullability patches, and the react-native-screens
      # removeLast() rewrite. Those steps were removed with the SDK 54 upgrade;
      # forcing them now would downgrade the toolchain and break the build.

      # react-native-iap 15 no longer publishes play/amazon store flavours on a
      # `store` dimension (SDK 51 used iap 12, which did and needed a
      # missingDimensionStrategy patch here). iap 15 resolves its own platform
      # flavour internally, defaulting to Google Play, so no app-side strategy
      # is required. The patch was removed with the SDK 54 upgrade.

      # Decode the upload keystore from the ANDROID_KEYSTORE_BASE64 secret
      # and wire it into the release signing config. When the secret is
      # absent the build falls back to Expo's prebuild default (debug
      # keystore) so the workflow still runs for branches that haven't
      # been granted the secret — those builds work for sideload but
      # can't be uploaded to Play Store.
      #
      # The four secrets that need to exist for Play-ready signing:
      #   ANDROID_KEYSTORE_BASE64  base64 of the .keystore file
      #   ANDROID_KEYSTORE_PASSWORD  the keystore password
      #   ANDROID_KEY_ALIAS  e.g. volyume-upload
      #   ANDROID_KEY_PASSWORD  same as keystore password for PKCS12
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty. Set the 4 signing secrets in repo Settings before re-running."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::One of ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD is empty."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore
          if [ ! -s android/app/upload.keystore ]; then
            echo "::error::Decoded keystore is empty. ANDROID_KEYSTORE_BASE64 is not valid base64 of a keystore."
            exit 1
          fi
          echo "✓ upload.keystore decoded ($(wc -c < android/app/upload.keystore) bytes) at android/app/upload.keystore"

          # Rewrite the release signingConfig in app/build.gradle to use the
          # upload keystore. Credentials come from -P CLI flags at build
          # time (see the build step) so the keystore filename is the only
          # value baked into build.gradle. storeFile is unguarded — if the
          # keystore is missing, the build fails loudly instead of producing
          # a debug-signed AAB.
          python3 - <<'PYEOF'
          import re, pathlib, sys
          p = pathlib.Path('android/app/build.gradle')
          src = p.read_text()

          if 'upload.keystore' in src:
              print('build.gradle already references upload.keystore — skipping patch')
              sys.exit(0)

          if 'signingConfigs {' not in src:
              print('::error::signingConfigs block not found in build.gradle')
              sys.exit(1)

          # 1. Insert a release{} block inside signingConfigs{}.
          # storeFile is hardcoded; credentials come from -P flags via
          # project.findProperty. findProperty returns null if the property
          # isn't set, which gradle treats as "missing required property"
          # and fails the build — the desired loud failure.
          src = src.replace(
              'signingConfigs {',
              'signingConfigs {\n        release {\n'
              '            storeFile file("upload.keystore")\n'
              '            storePassword project.findProperty("VOLYUME_UPLOAD_STORE_PASSWORD")\n'
              '            keyAlias project.findProperty("VOLYUME_UPLOAD_KEY_ALIAS")\n'
              '            keyPassword project.findProperty("VOLYUME_UPLOAD_KEY_PASSWORD")\n'
              '        }',
              1,
          )

          # 2. Swap the release buildType to point at signingConfigs.release.
          # Match `release { ... signingConfig signingConfigs.debug` anywhere
          # in the file. [^{}]*? keeps the match local to the release block.
          new_src, count = re.subn(
              r'(release\s*\{[^{}]*?)signingConfig\s+signingConfigs\.debug',
              r'\1signingConfig signingConfigs.release',
              src,
              count=1,
              flags=re.DOTALL,
          )
          if count == 0:
              print('::error::Could not find `signingConfig signingConfigs.debug` inside release{} buildType.')
              m = re.search(r'buildTypes\s*\{.{0,1500}', src, re.DOTALL)
              if m:
                  print('--- buildTypes block found in file: ---')
                  print(m.group(0))
              sys.exit(1)
          src = new_src

          p.write_text(src)
          final = p.read_text()
          if 'signingConfigs.release' not in final or 'upload.keystore' not in final:
              print('::error::Verification failed after write')
              sys.exit(1)
          print('✓ Patched build.gradle to use upload signing config')
          PYEOF
          # Dump the patched signingConfigs and buildTypes blocks to the log so
          # any future "why is it still debug-signed?" question takes 10s to
          # diagnose instead of three hours.
          echo "--- signingConfigs block after patch ---"
          awk '/signingConfigs *\{/,/^    \}/' android/app/build.gradle
          echo "--- release buildType after patch ---"
          awk '/release *\{/,/^        \}/' android/app/build.gradle | head -20

      # Release build embeds the JS bundle (index.android.bundle) into the
      # APK/AAB, so it runs standalone without a Metro dev server.
      # assembleRelease produces an APK (for sideload), bundleRelease
      # produces an AAB (the format Play Store wants). Signing credentials
      # are passed via -P so they never have to be written to disk.
      # ABI set comes from REACT_NATIVE_ARCHITECTURES (top-level env): main and
      # manual runs build the Play-ready armeabi-v7a,arm64-v8a; claude/** branch
      # pushes build a single fast arm64-v8a compile-check. The default RN
      # template builds all four ABIs (armeabi-v7a, arm64-v8a, x86, x86_64), but
      # under the New Architecture each ABI compiles a large amount of C++
      # (Fabric, TurboModule codegen, nitro, reanimated worklets); four ABIs took
      # ~60+ min and risked OOM thrash on the runner, so we ship the two ABIs
      # real devices need (32- and 64-bit ARM) and skip the x86 emulator ABIs.
      # The branch compile-check stays single-ABI purely to prove the native
      # side compiles fast.
      - name: Build Release APK + AAB
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_USDA_API_KEY: ${{ secrets.EXPO_PUBLIC_USDA_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN != '' && 'false' || 'true' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Skip the release "vital" lint tasks. assembleRelease/bundleRelease
          # depend on lintVitalRelease (which fans out to lintVitalAnalyzeRelease
          # + lintVitalReportRelease per module). Under SDK 54 / AGP 8 those fail
          # for some library modules (react-native-async-storage, expo-modules-
          # core). Lint is advisory, not a compile or correctness gate, and these
          # are library-side strictness issues, not app bugs. Excluding the tasks
          # with -x is evaluation-order-safe (unlike editing build.gradle, which
          # hit "Cannot run afterEvaluate when the project is already evaluated"
          # because Expo/RN autolinking evaluates subprojects eagerly). -x matches
          # the unqualified task name across every module.
          cd android && ./gradlew assembleRelease bundleRelease \
            --no-daemon --no-configuration-cache \
            -PreactNativeArchitectures="$REACT_NATIVE_ARCHITECTURES" \
            -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease \
            -PVOLYUME_UPLOAD_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PVOLYUME_UPLOAD_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PVOLYUME_UPLOAD_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      # Verify the AAB is signed with the upload keystore, NOT the debug
      # keystore. Play Store rejects debug-signed bundles with a generic
      # "you uploaded an APK or Android App Bundle that was signed in debug
      # mode" error, which is what bit us before this check existed.
      - name: Verify AAB is release-signed
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then
            echo "::error::AAB not produced at $AAB"
            exit 1
          fi
          # Extract the keystore's SHA-1 (the signer's cert fingerprint).
          UPLOAD_SHA1=$(keytool -list -v -keystore android/app/upload.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -E '^\s*SHA1:' | head -1 | awk '{print $2}')
          # Pull the cert SHA-1 actually used to sign the AAB.
          AAB_SHA1=$(unzip -p "$AAB" 'META-INF/*.RSA' 2>/dev/null \
            | keytool -printcert 2>/dev/null \
            | grep -E '^\s*SHA1:' | head -1 | awk '{print $2}')
          if [ -z "$AAB_SHA1" ]; then
            # Older AABs land the signer block under a different name. Fall
            # back to apksigner if available.
            if command -v apksigner >/dev/null 2>&1; then
              AAB_SHA1=$(apksigner verify --print-certs "$AAB" 2>/dev/null \
                | grep -iE 'SHA-1 digest' | head -1 | awk '{print toupper($NF)}' \
                | sed 's/\(..\)/\1:/g;s/:$//')
            fi
          fi
          DEBUG_SHA1='B1:11:B1:11:B1:11:B1:11:B1:11:B1:11:B1:11:B1:11:B1:11:B1:11' # well-known Android debug
          echo "Upload keystore SHA-1: $UPLOAD_SHA1"
          echo "AAB signer SHA-1     : $AAB_SHA1"
          if [ -z "$AAB_SHA1" ]; then
            echo "::warning::Could not extract AAB signer cert (verification skipped)"
          elif [ "$UPLOAD_SHA1" = "$AAB_SHA1" ]; then
            echo "✓ AAB is signed with the upload keystore. Play-ready."
          else
            echo "::error::AAB is NOT signed with the upload keystore."
            echo "::error::Expected $UPLOAD_SHA1, got $AAB_SHA1."
            echo "::error::Play Store will reject this AAB. Check the Configure release signing step."
            exit 1
          fi

      - name: Verify native libraries are 16 KB page-size compatible
        run: |
          npm run verify:android:16kb -- \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: volyume-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: volyume-release-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Status report written as a workflow artifact instead of a
      # git push back to the branch. The previous design committed
      # .ci-status/latest.md as github-actions[bot] with a [skip ci]
      # marker on every run; run #714 (2026-05-26) hit a status push
      # failure ("Status push failed (continuing)") and from that
      # point onward GitHub stopped delivering push webhook events
      # to the Actions trigger system for this repo. The fix removes
      # the workflow's outbound git push entirely; the status file
      # is still produced and is downloadable from the run page.
      #
      # 2026-06-05: push-trigger flaked again. Commit d2c2c4b (a build-ios.yml
      # change, a non-ignored path) landed on main but did not start a run after
      # several minutes, and the API dispatch route is not available to the
      # automation token (403 "Resource not accessible by integration"). This
      # commit is a no-op nudge to re-fire the push trigger and validate the
      # SDK 54 release fix (lint handled via -x task exclusions, promise hoisted).
      - name: Write build status
        if: always()
        env:
          URL_LEN: ${{ steps.verify.outputs.url_len }}
          KEY_LEN: ${{ steps.verify.outputs.key_len }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          mkdir -p .ci-status
          cat > .ci-status/latest.md <<EOF
          # Latest CI Build Status

          - **Run number**: ${{ github.run_number }}
          - **Run URL**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Branch**: \`${{ github.ref_name }}\`
          - **Commit**: \`${{ github.sha }}\`
          - **Triggered at**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - **Job status at write time**: \`$JOB_STATUS\`

          ## Secret lengths (values not logged)

          | Secret | Length |
          |---|---|
          | EXPO_PUBLIC_SUPABASE_URL | ${URL_LEN:-unset} |
          | EXPO_PUBLIC_SUPABASE_ANON_KEY | ${KEY_LEN:-unset} |

          ## Interpretation

          - URL length \`0\`: secret is empty, re-paste in repo Settings.
          - URL length \`~40\`: looks right (\`https://abcdef.supabase.co\`).
          - KEY length \`0\`: secret is empty, re-paste in repo Settings.
          - KEY length \`~220\`: looks right (JWT starting with \`eyJ\`).
          - Length \`unset\`: the verify step didn't run (build failed before npm install).

          EOF

      - name: Upload build status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-status-${{ github.run_number }}
          path: .ci-status/latest.md
          retention-days: 30
