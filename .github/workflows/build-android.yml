name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/build-volyume-app-srY9C
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # expo-modules-core 1.12.x uses `from components.release` inside
      # afterEvaluate which fails with AGP 8.4+. Patch it to use
      # findByName() so the build doesn't crash during configuration.
      - name: Patch expo-modules-core for AGP 8.4+ compatibility
        run: |
          python3 << 'PYEOF'
          with open('node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle') as f:
              content = f.read()
          old = (
              '  project.afterEvaluate {\n'
              '    publishing {\n'
              '      publications {\n'
              '        release(MavenPublication) {\n'
              '          from components.release\n'
              '        }\n'
              '      }\n'
              '      repositories {\n'
              '        maven {\n'
              '          url = mavenLocal().url\n'
              '        }\n'
              '      }\n'
              '    }\n'
              '  }'
          )
          new = (
              '  project.afterEvaluate {\n'
              '    def releaseComponent = components.findByName(\'release\')\n'
              '    if (releaseComponent != null) {\n'
              '      publishing {\n'
              '        publications {\n'
              '          release(MavenPublication) {\n'
              '            from releaseComponent\n'
              '          }\n'
              '        }\n'
              '        repositories {\n'
              '          maven {\n'
              '            url = mavenLocal().url\n'
              '          }\n'
              '        }\n'
              '      }\n'
              '    }\n'
              '  }'
          )
          patched = content.replace(old, new)
          if patched == content:
              print('WARNING: pattern not found, file unchanged')
          else:
              with open('node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle', 'w') as f:
                  f.write(patched)
              print('Patched ExpoModulesCorePlugin.gradle successfully')
          PYEOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # Release build embeds the JS bundle (index.android.bundle) into the APK,
      # so it runs standalone without a Metro dev server. Expo's prebuild
      # template signs the release buildType with the debug keystore by
      # default, so this APK installs and runs without a custom keystore —
      # suitable for sideloaded testing (not for Play Store submission).
      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: volyume-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
