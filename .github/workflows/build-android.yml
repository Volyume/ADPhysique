name: Build Android APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # Pin Gradle wrapper to 8.9. Several Expo SDK 51 packages (expo-notifications,
      # react-native-reanimated, @shopify/react-native-skia, etc.) use deprecated
      # Gradle APIs that are incompatible with Gradle 9.0. Pinning to 8.9 fixes
      # all of them in one step rather than patching each package individually.
      - name: Pin Gradle wrapper to 8.9
        run: |
          PROPS=android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip|' "$PROPS"
          echo "Gradle wrapper pinned to:"
          grep distributionUrl "$PROPS"

      # expo-modules-core 1.12.x uses `from components.release` inside
      # afterEvaluate which fails with AGP 8.4+. Run this patch as the
      # very last step before Gradle so nothing can undo it.
      - name: Patch expo-modules-core for AGP 8.4+ compatibility
        run: |
          FILE=node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
          sed -i '/from components\.release/d' "$FILE"
          grep -n 'components' "$FILE" || echo "✓ No components references remain"

      # @react-native/gradle-plugin imports `serviceOf` from an internal
      # Gradle package that was relocated in Gradle 8.7+. Without this
      # patch the plugin's own build.gradle.kts fails to compile under
      # the Gradle 8.9 we pin above with:
      #   Unresolved reference: serviceOf
      - name: Patch @react-native/gradle-plugin for Gradle 8.7+ compatibility
        run: |
          FILE=node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/build.gradle.kts
          sed -i 's|org.gradle.configurationcache.extensions.serviceOf|org.gradle.kotlin.dsl.support.serviceOf|' "$FILE"
          grep -n 'serviceOf' "$FILE" || echo "✗ Patch did not apply"

      # Release build embeds the JS bundle (index.android.bundle) into the APK,
      # so it runs standalone without a Metro dev server. Expo's prebuild
      # template signs the release buildType with the debug keystore by
      # default, so this APK installs and runs without a custom keystore —
      # suitable for sideloaded testing (not for Play Store submission).
      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon --no-configuration-cache
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: volyume-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
