name: Build Android (APK + AAB, signed)

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # Pin Gradle wrapper to 8.9. Several Expo SDK 51 packages (expo-notifications,
      # react-native-reanimated, @shopify/react-native-skia, etc.) use deprecated
      # Gradle APIs that are incompatible with Gradle 9.0. Pinning to 8.9 fixes
      # all of them in one step rather than patching each package individually.
      - name: Pin Gradle wrapper to 8.9
        run: |
          PROPS=android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip|' "$PROPS"
          echo "Gradle wrapper pinned to:"
          grep distributionUrl "$PROPS"

      # expo-modules-core 1.12.x uses `from components.release` inside
      # afterEvaluate which fails with AGP 8.4+. Run this patch as the
      # very last step before Gradle so nothing can undo it.
      - name: Patch expo-modules-core for AGP 8.4+ compatibility
        run: |
          FILE=node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
          sed -i '/from components\.release/d' "$FILE"
          grep -n 'components' "$FILE" || echo "✓ No components references remain"

      # @react-native/gradle-plugin imports `serviceOf` from an internal
      # Gradle package that was relocated in Gradle 8.7+. Without this
      # patch the plugin's own build.gradle.kts fails to compile under
      # the Gradle 8.9 we pin above with:
      #   Unresolved reference: serviceOf
      - name: Patch @react-native/gradle-plugin for Gradle 8.7+ compatibility
        run: |
          FILE=node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/build.gradle.kts
          sed -i 's|org.gradle.configurationcache.extensions.serviceOf|org.gradle.kotlin.dsl.support.serviceOf|' "$FILE"
          grep -n 'serviceOf' "$FILE" || echo "✗ Patch did not apply"

      # Decode the upload keystore from the ANDROID_KEYSTORE_BASE64 secret
      # and wire it into the release signing config. When the secret is
      # absent the build falls back to Expo's prebuild default (debug
      # keystore) so the workflow still runs for branches that haven't
      # been granted the secret — those builds work for sideload but
      # can't be uploaded to Play Store.
      #
      # The four secrets that need to exist for Play-ready signing:
      #   ANDROID_KEYSTORE_BASE64  base64 of the .keystore file
      #   ANDROID_KEYSTORE_PASSWORD  the keystore password
      #   ANDROID_KEY_ALIAS  e.g. volyume-upload
      #   ANDROID_KEY_PASSWORD  same as keystore password for PKCS12
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is empty - building unsigned (debug keystore fallback)."
            echo "APK from this build will work for sideload but cannot be uploaded to Play Store."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore
          cat >> android/gradle.properties <<EOF
          VOLYUME_UPLOAD_STORE_FILE=upload.keystore
          VOLYUME_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          VOLYUME_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS
          VOLYUME_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF
          # Rewrite the release signingConfig in app/build.gradle to use the
          # upload keystore instead of the debug keystore. Expo's prebuild
          # template hard-codes the debug signingConfig, so we patch it
          # post-prebuild rather than maintaining a fork of the template.
          GRADLE_FILE=android/app/build.gradle
          python3 - <<'PYEOF'
          import re, pathlib
          p = pathlib.Path('android/app/build.gradle')
          src = p.read_text()
          # Add a new signingConfigs.release block right before the existing release {} buildType.
          if 'signingConfigs.release' not in src and 'VOLYUME_UPLOAD_STORE_FILE' not in src:
              src = src.replace(
                  'signingConfigs {',
                  'signingConfigs {\n        release {\n            if (project.hasProperty(\"VOLYUME_UPLOAD_STORE_FILE\")) {\n                storeFile file(VOLYUME_UPLOAD_STORE_FILE)\n                storePassword VOLYUME_UPLOAD_STORE_PASSWORD\n                keyAlias VOLYUME_UPLOAD_KEY_ALIAS\n                keyPassword VOLYUME_UPLOAD_KEY_PASSWORD\n            }\n        }',
                  1,
              )
              src = re.sub(
                  r'buildTypes\s*\{\s*release\s*\{([^}]*?)signingConfig\s+signingConfigs\.debug',
                  lambda m: m.group(0).replace('signingConfigs.debug', 'signingConfigs.release'),
                  src,
                  count=1,
                  flags=re.DOTALL,
              )
              p.write_text(src)
              print('Patched build.gradle to use upload signing config')
          else:
              print('build.gradle already references upload signing config')
          PYEOF

      # Release build embeds the JS bundle (index.android.bundle) into the
      # APK/AAB, so it runs standalone without a Metro dev server.
      # assembleRelease produces an APK (for sideload), bundleRelease
      # produces an AAB (the format Play Store wants).
      - name: Build Release APK + AAB
        run: cd android && ./gradlew assembleRelease bundleRelease --no-daemon --no-configuration-cache
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: volyume-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: volyume-release-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
