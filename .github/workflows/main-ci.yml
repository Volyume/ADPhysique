name: Main CI (tests + lint + Expo Doctor)

# Real protection layer for main. Per the 2026-05-26 audit, the
# Android build workflow does not run Jest or Expo Doctor, so code
# that compiles can still ship with broken tests. This workflow
# closes that gap.
#
# Uses 'npm ci' so any future package-lock.json drift fails CI
# loudly instead of being silently papered over by 'npm install'.
# CLAUDE.md release policy 2026-05-24 is unchanged: this is
# pre-merge protection, not a release pipeline.

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
      - '.ci-status/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

# GitHub forces JavaScript actions onto Node 24 on 2026-06-16. Opt in early so
# CI proves Node 24 compatibility on our schedule, not on the forced flag day.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Jest unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Jest
        id: jest
        # --forceExit removed 2026-05-27. The original tech-debt
        # comment blamed useFocusEffect + tabPress addListener
        # without a NavigationContainer; that was a red herring.
        # The actual cause was two leaked setTimeout()s inside
        # HomeScreen's useEffect (lines 162-163): the effect
        # schedules them and returns a clearTimeout cleanup, but
        # the screen-mount test harness never unmounted the tree
        # so the cleanup never ran.
        #
        # Fix in src/__tests__/screen-mount.test.js: every tree
        # mountScreen creates is registered in a module-level Set,
        # and a top-level afterEach drains and unmounts the batch.
        # `jest --detectOpenHandles` on the full suite now reports
        # zero leaks and exit code is 0.
        #
        # --runInBand still emits a soft "Jest did not exit one
        # second after" advisory after the run because of slow
        # module destruction (Supabase realtime client + similar
        # singletons hold references to the worker process until
        # GC sweeps them). It is informational; exit code is 0.
        # Dropping --runInBand would silence it but reintroduces
        # parallel-state pollution flakes we saw earlier — keep
        # it for determinism.
        #
        # `tee` captures the full Jest output to jest.log so the
        # "Surface Jest failure" step below can tail the relevant
        # FAIL block into $GITHUB_STEP_SUMMARY when Jest exits
        # non-zero. The exit code propagates via PIPESTATUS so the
        # job still fails correctly. Diagnostic added 2026-05-27
        # after the live-cloud E2E suite first ran red and the
        # log was unreachable from the assistant's environment
        # (job-log API needs auth; MCP doesn't expose check-run
        # output text; unauth API rate-limits this container).
        run: |
          set -o pipefail
          npx jest --runInBand --ci 2>&1 | tee jest.log

      - name: Surface Jest failure into the run summary
        # Only fires when the Jest step failed. Extracts the
        # bottom of the log (final FAIL blocks + the totals line)
        # into $GITHUB_STEP_SUMMARY so the run page shows the
        # failure detail inline, no artefact download required.
        # The assistant's environment can read step summaries via
        # the GitHub Actions web UI even without an auth token,
        # so a CI failure becomes diagnosable from the chat.
        if: failure() && steps.jest.conclusion == 'failure'
        run: |
          {
            echo "## Jest failure detail"
            echo
            echo "Full log uploaded as the \`jest-log\` artefact. Excerpt below."
            echo
            echo '<details><summary>Last 200 lines of jest.log</summary>'
            echo
            echo '```'
            tail -n 200 jest.log || echo "(jest.log missing)"
            echo '```'
            echo
            echo '</details>'
            echo
            echo '<details><summary>Every FAIL block</summary>'
            echo
            echo '```'
            # Grab every "FAIL " block plus 60 lines of context
            grep -nE "^FAIL |^  ● |^  expect\(|^Tests:|^Test Suites:" jest.log 2>/dev/null | head -120 || echo "(no FAIL markers found)"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Jest log
        if: always() && steps.jest.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: jest-log
          path: jest.log
          if-no-files-found: warn

      - name: Post Jest failure comment to PR
        # Reads jest.log on failure and posts the relevant chunk as
        # a PR comment via GITHUB_TOKEN. The comment is readable
        # via the GitHub MCP server's pull_request_read /
        # get_comments method, so a CI failure is diagnosable from
        # chat with no manual log paste required. Only fires on
        # pull_request events so push-to-main runs don't try to
        # post against a non-existent PR.
        if: failure() && steps.jest.conclusion == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('jest.log', 'utf8'); }
            catch (e) { log = '(jest.log missing — Jest may have crashed before tee opened the file)'; }
            const lines = log.split('\n');
            const tail = lines.slice(-220).join('\n');
            // Collect every line that looks like a Jest failure marker.
            const failMarkers = lines
              .filter((l) => /^FAIL |^  ● |^  expect\(|^    expect\(|^Tests:|^Test Suites:/.test(l))
              .slice(0, 150)
              .join('\n');
            const body = [
              '## Jest failure detail (auto-posted by main-ci.yml)',
              '',
              `Run: ${context.payload.pull_request.html_url}/checks`,
              '',
              '<details><summary>Failure markers</summary>',
              '',
              '```',
              failMarkers || '(no FAIL markers matched the regex)',
              '```',
              '',
              '</details>',
              '',
              '<details><summary>Last 220 lines of jest.log</summary>',
              '',
              '```',
              tail,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  eslint:
    name: ESLint (no-undef + hooks gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Errors-only gate. `eslint .` exits non-zero only on error-level
      # rules (no-undef, react-hooks/rules-of-hooks); the no-unused-vars
      # and exhaustive-deps backlog is warning-level and does not fail CI.
      # Added 2026-05-29 (audit Phase 0): the repo had no static analysis,
      # which let two no-undef-class bugs ship to a Hermes runtime.
      - name: Run ESLint
        run: npm run lint

      # Static type check over JSDoc (this repo is JS, not TS; tsc --noEmit
      # only checks types, it does not emit). Added so a JSDoc-type
      # regression is caught on the PR gate instead of only in
      # release:check, which only runs pre-release.
      - name: Run typecheck
        run: npm run typecheck

      # Enforces the src/lib import-boundary rules (see
      # scripts/check-imports.cjs). Added alongside typecheck so an
      # import-boundary violation is caught on the PR gate instead of only
      # in release:check, which only runs pre-release.
      - name: Run import boundary check
        run: npm run check:imports

  expo-doctor:
    name: Expo Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Expo Doctor
        run: npx expo-doctor
