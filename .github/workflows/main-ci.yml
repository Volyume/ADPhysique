name: Main CI (tests + lint + Expo Doctor)

# Real protection layer for main. Per the 2026-05-26 audit, the
# Android build workflow does not run Jest, Maestro lint, or
# Expo Doctor, so code that compiles can still ship with broken
# tests or malformed e2e flows. This workflow closes that gap.
#
# Uses 'npm ci' so any future package-lock.json drift fails CI
# loudly instead of being silently papered over by 'npm install'.
# CLAUDE.md release policy 2026-05-24 is unchanged: this is
# pre-merge protection, not a release pipeline.

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
      - '.ci-status/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Jest unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Jest
        # --forceExit removed 2026-05-27. The original tech-debt
        # comment blamed useFocusEffect + tabPress addListener
        # without a NavigationContainer; that was a red herring.
        # The actual cause was two leaked setTimeout()s inside
        # HomeScreen's useEffect (lines 162-163): the effect
        # schedules them and returns a clearTimeout cleanup, but
        # the screen-mount test harness never unmounted the tree
        # so the cleanup never ran.
        #
        # Fix in src/__tests__/screen-mount.test.js: every tree
        # mountScreen creates is registered in a module-level Set,
        # and a top-level afterEach drains and unmounts the batch.
        # `jest --detectOpenHandles` on the full suite now reports
        # zero leaks and exit code is 0.
        #
        # --runInBand still emits a soft "Jest did not exit one
        # second after" advisory after the run because of slow
        # module destruction (Supabase realtime client + similar
        # singletons hold references to the worker process until
        # GC sweeps them). It is informational; exit code is 0.
        # Dropping --runInBand would silence it but reintroduces
        # parallel-state pollution flakes we saw earlier — keep
        # it for determinism.
        run: npx jest --runInBand --ci
        env:
          # Live-cloud E2E (T7 + T8) opt-in. When all four are set,
          # src/lib/sync/__tests__/sync.e2e.liveCloud.test.js signs
          # in to the throwaway Supabase test project and runs the
          # two-device propagation + offline collision scenarios.
          # When ANY is missing, the suite registers a single
          # visible skipped test instead. Repo secrets — never paste
          # production values here. Setup walkthrough in
          # supabase/README.md § Live-cloud E2E test project.
          SUPABASE_TEST_URL:           ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY:      ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_TEST_USER_EMAIL:    ${{ secrets.SUPABASE_TEST_USER_EMAIL }}
          SUPABASE_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_PASSWORD }}

  maestro-lint:
    name: Maestro flow structural lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint Maestro flows
        run: node scripts/lint-maestro-flows.js

  expo-doctor:
    name: Expo Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Expo Doctor
        run: npx expo-doctor
