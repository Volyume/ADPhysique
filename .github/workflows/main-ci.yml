name: Main CI (tests + lint + Expo Doctor)

# Real protection layer for main. Per the 2026-05-26 audit, the
# Android build workflow does not run Jest or Expo Doctor, so code
# that compiles can still ship with broken tests. This workflow
# closes that gap.
#
# Uses 'npm ci' so any future package-lock.json drift fails CI
# loudly instead of being silently papered over by 'npm install'.
# CLAUDE.md release policy 2026-05-24 is unchanged: this is
# pre-merge protection, not a release pipeline.

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
      - '.ci-status/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

# GitHub forces JavaScript actions onto Node 24 on 2026-06-16. Opt in early so
# CI proves Node 24 compatibility on our schedule, not on the forced flag day.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Jest unit + integration tests
    runs-on: ubuntu-latest
    # Hang bound. The suite took 21 to 39 minutes on GitHub's runner across the
    # runs recorded in docs/ci-repair-2026-11-21/LOC-697-spec-and-evidence.md
    # (worst 38.9 minutes, run 44977585863); the default limit is 6 hours, which is how a stuck
    # job sat for hours. A leaked timer is reported within seconds by
    # scripts/ci/jestCiReporter.js, so this only backs that up.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Jest
        id: jest
        # --forceExit removed 2026-05-27. The original tech-debt
        # comment blamed useFocusEffect + tabPress addListener
        # without a NavigationContainer; that was a red herring.
        # The actual cause was two leaked setTimeout()s inside
        # HomeScreen's useEffect (lines 162-163): the effect
        # schedules them and returns a clearTimeout cleanup, but
        # the screen-mount test harness never unmounted the tree
        # so the cleanup never ran.
        #
        # Fix in src/__tests__/screen-mount.test.js: every tree
        # mountScreen creates is registered in a module-level Set,
        # and a top-level afterEach drains and unmounts the batch.
        # `jest --detectOpenHandles` on the full suite now reports
        # zero leaks and exit code is 0.
        #
        # --runInBand is kept for determinism: dropping it reintroduces the
        # parallel-state pollution flakes seen earlier.
        #
        # The old note here called "Jest did not exit one second after the test
        # run has completed" a soft advisory with exit code 0. It is not: on
        # 21 November 2026 every suite had passed (1819 of 1819) and the job
        # then waited for hours, until GitHub cancelled it, because two
        # Community screen tests left a real 20 s setInterval running (LOC-697;
        # last green run was 1 October). scripts/ci/jestCiReporter.js now
        # names any such timer, fails the run and ends the process within
        # seconds, and prints a START/END line per test file so a stall names
        # its file. The fix itself is in the tests (unmount what they mount);
        # --forceExit is deliberately NOT used, because it would hide leaks.
        #
        # `tee` captures the full Jest output to jest.log so the
        # "Surface Jest failure" step below can tail the relevant
        # FAIL block into $GITHUB_STEP_SUMMARY when Jest exits
        # non-zero. The exit code propagates via PIPESTATUS so the
        # job still fails correctly. Diagnostic added 2026-05-27
        # after the live-cloud E2E suite first ran red and the
        # log was unreachable from the assistant's environment
        # (job-log API needs auth; MCP doesn't expose check-run
        # output text; unauth API rate-limits this container).
        run: |
          set -o pipefail
          npx jest --runInBand --ci --reporters=default --reporters=./scripts/ci/jestCiReporter.js 2>&1 | tee jest.log

      - name: Surface Jest failure into the run summary
        # Only fires when the Jest step failed. Extracts the
        # bottom of the log (final FAIL blocks + the totals line)
        # into $GITHUB_STEP_SUMMARY so the run page shows the
        # failure detail inline, no artefact download required.
        # The assistant's environment can read step summaries via
        # the GitHub Actions web UI even without an auth token,
        # so a CI failure becomes diagnosable from the chat.
        if: failure() && steps.jest.conclusion == 'failure'
        run: |
          {
            echo "## Jest failure detail"
            echo
            echo "Full log uploaded as the \`jest-log\` artefact. Excerpt below."
            echo
            echo '<details><summary>Last 200 lines of jest.log</summary>'
            echo
            echo '```'
            tail -n 200 jest.log || echo "(jest.log missing)"
            echo '```'
            echo
            echo '</details>'
            echo
            echo '<details><summary>Every FAIL block</summary>'
            echo
            echo '```'
            # Grab every "FAIL " block plus 60 lines of context
            grep -nE "^FAIL |^  ● |^  expect\(|^Tests:|^Test Suites:" jest.log 2>/dev/null | head -120 || echo "(no FAIL markers found)"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Jest log
        if: always() && steps.jest.conclusion != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jest-log
          path: jest.log
          if-no-files-found: warn

  # The same Jest suite with the clock set to a moment when a test that counts
  # days as 24 hours is wrong. Blocks and weeks count LOCAL calendar days and UK
  # clocks change twice a year, so "n weeks ago" built as n x 7 x 24 hours is a
  # day out between 23:00 and midnight UK time after the October change and
  # between 00:00 and 01:00 after the March change. Two tests failed Main CI that
  # way on 21 November 2026 and three more were found by the sweep (LOC-697).
  # libfaketime moves the whole process clock (it keeps running), so nothing in
  # the tests changes and no test sees a frozen clock.
  #
  # The clock keeps running, so each job starts at the OPENING of its 60-minute
  # window (23:00:05 UTC in both rows) and the suite, which takes 21 to 39
  # minutes, stays inside it. scripts/ci/jestCiReporter.js reads CLOCK_WINDOW_END
  # and fails the job if any test file starts after the window ends, so a slow
  # runner turns the job red and says so instead of shrinking the check.
  test-clock:
    name: Jest at ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 23:00 to 24:00 UK time, 5 days after the October 2026 clock change
            now: '2026-10-30 23:00:05'
            end: '2026-10-31T00:00:00Z'
          - label: 00:00 to 01:00 UK summer time, 6 days after the March 2027 clock change
            now: '2027-04-02 23:00:05'
            end: '2027-04-03T00:00:00Z'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install libfaketime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq faketime

      - name: Run Jest with the clock at ${{ matrix.now }} UTC
        env:
          FAKETIME_DONT_FAKE_MONOTONIC: '1'
          CLOCK_WINDOW_END: ${{ matrix.end }}
        run: |
          set -o pipefail
          faketime -f "@${{ matrix.now }}" node -e "console.log('CLOCK', new Date().toISOString())"
          faketime -f "@${{ matrix.now }}" npx jest --runInBand --ci --reporters=default --reporters=./scripts/ci/jestCiReporter.js 2>&1 | tee jest.log

      - name: Upload Jest log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jest-log-clock-${{ strategy.job-index }}
          path: jest.log
          if-no-files-found: warn

  eslint:
    name: ESLint (no-undef + hooks gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Zero-warning gate. The July 2026 whole-app hardening pass cleared the
      # existing React Native accessibility/unused-local warning debt, so new
      # warnings fail CI instead of rebuilding the backlog.
      - name: Run ESLint
        run: npm run lint

      # Static type check over JSDoc (this repo is JS, not TS; tsc --noEmit
      # only checks types, it does not emit). Added so a JSDoc-type
      # regression is caught on the PR gate instead of only in
      # release:check, which only runs pre-release.
      - name: Run typecheck
        run: npm run typecheck

      # Enforces the src/lib import-boundary rules (see
      # scripts/check-imports.cjs). Added alongside typecheck so an
      # import-boundary violation is caught on the PR gate instead of only
      # in release:check, which only runs pre-release.
      - name: Run import boundary check
        run: npm run check:imports

  expo-doctor:
    name: Expo Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Expo Doctor
        run: npx expo-doctor

  web:
    name: Web lint, test, build + prod audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run web lint
        run: pnpm lint

      - name: Run web typecheck
        run: pnpm typecheck

      - name: Run web tests
        run: pnpm --filter @volyume/web test

      - name: Build web app
        run: pnpm --filter @volyume/web build

      - name: Audit web production dependencies
        run: pnpm audit --prod
