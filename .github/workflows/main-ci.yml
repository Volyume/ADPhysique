name: Main CI (tests + lint + Expo Doctor)

# Real protection layer for main. Per the 2026-05-26 audit, the
# Android build workflow does not run Jest, Maestro lint, or
# Expo Doctor, so code that compiles can still ship with broken
# tests or malformed e2e flows. This workflow closes that gap.
#
# Uses 'npm ci' so any future package-lock.json drift fails CI
# loudly instead of being silently papered over by 'npm install'.
# CLAUDE.md release policy 2026-05-24 is unchanged: this is
# pre-merge protection, not a release pipeline.

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
      - '.ci-status/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Jest unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Jest
        # TECHNICAL DEBT — --forceExit is explicitly TEMPORARY.
        #
        # Root cause: HomeScreen + a handful of other Pro screens
        # use @react-navigation/native's useFocusEffect +
        # navigation.getParent()?.addListener('tabPress', ...) at
        # mount. The test harness's makeNav() in
        # src/__tests__/screen-mount.test.js provides a flat
        # jest.fn() mock for navigation; useFocusEffect's behaviour
        # without a real NavigationContainer fires its callback
        # asynchronously and a setState in that callback lands AFTER
        # the test's await chain ends. React emits an act() warning,
        # Jest's BufferedConsole wraps it as "Cannot log after tests
        # are done", and --ci treats that as a failure signal even
        # though every assertion passed.
        #
        # The PROPER fix is to wrap mountScreen in a
        # NavigationContainer (with a mocked navigator state) so
        # useFocusEffect resolves synchronously and addListener has
        # a real subscriber surface. That is a substantial harness
        # rewrite touching the entire screen-mount.test.js file +
        # the make-Nav helper + every test that passes a screen
        # navigation prop. Not in scope for the current audit
        # response.
        #
        # Codex re-audit 2026-05-26 explicitly named
        # --silent/--forceExit as an acceptable temporary path
        # provided it is documented as such. Tracked here as a
        # FOLLOW-UP, not closed:
        #   TODO(codex-f2ci-followup): wrap mountScreen in a
        #   NavigationContainer so useFocusEffect resolves
        #   synchronously, then remove --forceExit and verify
        #   warning count is 0.
        run: npx jest --runInBand --ci --forceExit
        env:
          # Live-cloud E2E (T7 + T8) opt-in. When all four are set,
          # src/lib/sync/__tests__/sync.e2e.liveCloud.test.js signs
          # in to the throwaway Supabase test project and runs the
          # two-device propagation + offline collision scenarios.
          # When ANY is missing, the suite registers a single
          # visible skipped test instead. Repo secrets — never paste
          # production values here. Setup walkthrough in
          # supabase/README.md § Live-cloud E2E test project.
          SUPABASE_TEST_URL:           ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY:      ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_TEST_USER_EMAIL:    ${{ secrets.SUPABASE_TEST_USER_EMAIL }}
          SUPABASE_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_PASSWORD }}

  maestro-lint:
    name: Maestro flow structural lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint Maestro flows
        run: node scripts/lint-maestro-flows.js

  expo-doctor:
    name: Expo Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Expo Doctor
        run: npx expo-doctor
