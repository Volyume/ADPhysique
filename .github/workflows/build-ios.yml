name: Build iOS (EAS)

# Builds and (optionally) submits the iOS app entirely in CI, no Mac and no
# local terminal. EAS (Expo's cloud) does the Xcode compile and the Apple
# signing; this job just drives it non-interactively using:
#   - EXPO_TOKEN ............ Expo account access token (expo.dev)
#   - ASC_API_KEY_P8 ........ App Store Connect API key (.p8 file contents)
#   - ASC_KEY_ID ............ the key's Key ID
#   - ASC_ISSUER_ID ......... the key's Issuer ID
#   - EXPO_PUBLIC_* ......... the same app-config secrets the Android build uses
# all set in repo Settings → Secrets and variables → Actions.
#
# GOTCHA (cost us a day, 2026-06-10): EAS stores and REUSES the provisioning
# profile across builds. If a capability is added to the App ID later (e.g.
# Sign In with Apple), every new build is still signed with the OLD profile and
# the feature fails at runtime (ASAuthorizationError 1000, "authorization
# attempt failed for an unknown reason") even though the entitlement is in the
# binary and the capability is enabled. Fix: delete the provisioning profile on
# expo.dev → project → Credentials (keep the distribution certificate); the
# next build mints a fresh profile carrying all current App ID capabilities.
#
# IT HAPPENED AGAIN (build #146, 2026-08-18). `ios.associatedDomains:
# ["applinks:volyume.app"]` was added to app.json on 2026-08-11 (commit
# fc08bd1e, "Campaign 7: platform-requirements fix batch") so the
# https://volyume.app/partner universal links open the app -- the matching
# apple-app-site-association is served from public/.well-known/ by
# deploy-pages.yml. EAS synced the capability onto the App ID ("Synced
# capabilities: Enabled: Associated Domains, Push Notifications") but REUSED
# the stored profile minted 2026-06-10, which predates it, and fastlane failed:
#   Provisioning profile "*[expo] app.volyume AppStore 2026-06-10T11:35:55.490Z"
#   doesn't support the Associated Domains capability.
#   ... doesn't include the com.apple.developer.associated-domains entitlement.
# Same root cause, same one-time fix as above. Capability sync updates the App
# ID; it does NOT regenerate an already-active profile, and EAS exposes no
# non-interactive flag that forces it -- so ANY future app.json change adding an
# iOS capability needs the profile deleted once, by hand, before the next build.
# Recognise it by the two "doesn't support / doesn't include" lines in the
# fastlane step. Nothing in this repo needs changing when it appears.
#
# The App Store Connect API key (role Admin) lets EAS create the distribution
# certificate + provisioning profile for you, and submit to TestFlight, with no
# interactive Apple login. app.json must carry the EAS project id (extra.eas.projectId).
#
# Trigger: push to main builds and submits automatically, the same shape as the
# Android workflow, so a merged change reaches the iPhone via TestFlight without
# a manual step. Two differences from Android, both because an EAS cloud build
# costs build credits (unlike the free GitHub-runner Android build):
#   - main only, not feature branches, so feature-branch pushes don't spend credits.
#   - paths-ignore for docs/markdown/config-only commits, so a docs edit doesn't
#     spend a credit.
# workflow_dispatch is kept so a build can still be run by hand, with a toggle to
# skip the TestFlight submit. The concurrency guard cancels an in-flight build
# when a newer push lands, so a superseded commit doesn't sit on a paid runner.
on:
  # Manual only: each EAS iOS build costs build credits, so this never auto-runs
  # on a push. Run it from the Actions tab -> "Build iOS (EAS)" -> Run workflow.
  # Note: a push-triggered run can no longer submit to TestFlight even if the
  # trigger returns -- the submit steps require a manual run with the toggle.
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit to TestFlight after the build finishes'
        type: boolean
        default: true
      skip_build:
        description: 'Skip the EAS build and submit the latest existing build (no build credit spent)'
        type: boolean
        default: false
      allow_unsymbolicated:
        description: 'DANGER: build without Sentry symbols. A native crash will be unreadable without hand-disassembly.'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# GitHub forces JavaScript actions onto Node 24 on 2026-06-16. Opt in early so
# CI proves Node 24 compatibility on our schedule, not on the forced flag day.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: EAS iOS build + submit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          # PINNED, and not to a guess -- to the version that provably worked.
          #
          # Runs 143 and 144 (2026-07-30) both failed at Apple capability sync:
          #   Failed to patch capabilities: [ { capabilityType:
          #   'PUSH_NOTIFICATIONS', option: 'ON' }, ... ]
          #   Apple API error: The request entity is not a valid request document
          #   object - Unexpected or invalid value at
          #   'data.relationships.bundleIdCapabilities.data.[0].attributes'
          #
          # Comparing the two job logs isolates it to exactly one variable:
          #   run 142, 2026-07-13, eas-cli 20.5.1 -> "Synced capabilities:
          #     Enabled: Push Notifications | Disabled: ..." then built and
          #     submitted to TestFlight successfully.
          #   run 144, 2026-07-30, eas-cli 21.4.0 -> "Failed to sync
          #     capabilities" on the SAME payload.
          # Same repo config, same capability set, same Apple team, same answers
          # to the same prompts. Only the CLI differed, because `latest` moved
          # from 20.5.1 to 21.4.0 in between.
          #
          # eas-cli 21.x puts `attributes` inside a JSON:API RELATIONSHIP
          # linkage object, where only `type` and `id` are permitted, so Apple
          # rejects the whole document. That is an eas-cli bug, not an App ID
          # problem and not an Apple-side change: nothing was altered in the
          # Apple account, and the App ID needs no edit.
          #
          # Pinning is preferred over EXPO_NO_CAPABILITY_SYNC=1 (which the error
          # also suggests): on 20.5.1 the sync WORKS, and it is what keeps Push
          # Notifications enabled on the App ID. Skipping it would disable a
          # step that functions correctly. If a future EAS server change ever
          # forces a newer CLI, EXPO_NO_CAPABILITY_SYNC=1 on the build step is
          # the escape hatch -- but only alongside a manual check that Push
          # Notifications and Sign in with Apple are still enabled on the App ID.
          #
          # Revisit deliberately: bump this only when a newer eas-cli is
          # confirmed to sync capabilities without the Apple 409.
          eas-version: 20.5.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check required secrets are set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for v in EXPO_TOKEN ASC_API_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing repo secret: $v"; missing=1; fi
          done
          [ "$missing" = "0" ] || { echo "::error::Add the missing secrets in Settings → Secrets and variables → Actions, then re-run."; exit 1; }
          echo "✓ All required secrets present"

      - name: Write App Store Connect API key to a file
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc-api-key.p8"
          test -s "$RUNNER_TEMP/asc-api-key.p8" && echo "✓ ASC API key written ($(wc -c < "$RUNNER_TEMP/asc-api-key.p8") bytes)"

      # Push the app-config secrets up to EAS so the cloud build bundles real
      # values (not empty strings). Idempotent: --force overwrites if they exist.
      #
      # Sentry source-map upload: eas.json no longer disables it (1e2f1f3
      # enabled symbolicated prod crashes), so the @sentry/react-native build
      # phase runs sentry-cli on the EAS builder and needs SENTRY_AUTH_TOKEN.
      # That token lives on the EAS builder, not this GitHub runner, so it has
      # to be synced as an EAS secret here.
      #
      # CHANGED 2026-08-26 (adversarial audit). This used to fail SOFT: with no
      # token it pushed SENTRY_DISABLE_AUTO_UPLOAD and completed anyway. That is
      # exactly how build 57 reached real users with no dSYM, and why its
      # EXC_BREAKPOINT crash could only be identified by downloading the .ipa,
      # matching its LC_UUID and disassembling the crash address by hand. A
      # production build with observability switched off is now a hard failure
      # unless the dispatcher explicitly chooses it via allow_unsymbolicated.
      - name: Sync app config to EAS
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_USDA_API_KEY: ${{ secrets.EXPO_PUBLIC_USDA_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          eas secret:create --scope project --name EXPO_PUBLIC_SUPABASE_URL --value "$EXPO_PUBLIC_SUPABASE_URL" --type string --force
          eas secret:create --scope project --name EXPO_PUBLIC_SUPABASE_ANON_KEY --value "$EXPO_PUBLIC_SUPABASE_ANON_KEY" --type string --force
          if [ -n "$EXPO_PUBLIC_SENTRY_DSN" ]; then eas secret:create --scope project --name EXPO_PUBLIC_SENTRY_DSN --value "$EXPO_PUBLIC_SENTRY_DSN" --type string --force; fi
          if [ -n "$EXPO_PUBLIC_USDA_API_KEY" ]; then eas secret:create --scope project --name EXPO_PUBLIC_USDA_API_KEY --value "$EXPO_PUBLIC_USDA_API_KEY" --type string --force; fi
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            eas secret:create --scope project --name SENTRY_AUTH_TOKEN --value "$SENTRY_AUTH_TOKEN" --type string --force
            eas secret:delete --scope project --name SENTRY_DISABLE_AUTO_UPLOAD --non-interactive 2>/dev/null || true
            echo "✓ SENTRY_AUTH_TOKEN synced (source maps will upload, crashes symbolicate)"
          elif [ "${{ inputs.allow_unsymbolicated }}" = "true" ]; then
            # Deliberate, chosen at dispatch time, and loud about the cost.
            eas secret:create --scope project --name SENTRY_DISABLE_AUTO_UPLOAD --value "true" --type string --force
            echo "::warning title=Unsymbolicated build::SENTRY_AUTH_TOKEN is absent and allow_unsymbolicated was set. This build ships WITHOUT dSYMs or source maps. A native crash in it cannot be read without downloading the binary and disassembling by hand."
          else
            # HARD FAIL (adversarial audit 2026-08-26). This branch used to
            # disable the upload and carry on, so build 57 shipped to real users
            # with no dSYM. When it crashed with EXC_BREAKPOINT, Sentry could
            # show only <redacted> frames, and the only way to identify the
            # faulting function was to download the .ipa, match its LC_UUID and
            # disassemble the crash address. That must never be a silent
            # default. Set the SENTRY_AUTH_TOKEN repo secret, or dispatch again
            # with allow_unsymbolicated if you accept that cost knowingly.
            echo "::error title=Refusing to build without crash symbols::SENTRY_AUTH_TOKEN is not set, so this build would ship with no dSYMs and no source maps and its crashes would be unreadable. Add the SENTRY_AUTH_TOKEN repo secret, or re-run with allow_unsymbolicated=true to accept that deliberately."
            exit 1
          fi
          echo "✓ Config synced to EAS"

      # Keep the EAS driver interactive under expect because EAS can still ask
      # credential/push-notification questions on manual iOS runs even when the
      # credentials are already usable. The cloud builder itself is hardened in
      # eas.json with the pinned Node version used for dependency install.
      - name: Build iOS (EAS, waits for completion)
        if: ${{ !inputs.skip_build }}
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI: "false"
          EAS_SKIP_AUTO_FINGERPRINT: "1"
        run: |
          sudo apt-get install -y expect -qq 2>/dev/null
          expect <<'EOF'
          set timeout 6600
          spawn eas build --platform ios --profile production --wait
          expect {
            -re {Select your Apple Team Type}      { send -- "\033\[B\033\[B\r"; exp_continue }
            -re {set up Push Notifications}        { send -- "\033\[B\r";        exp_continue }
            -re {Apple ID:}                        { puts "\n::error::EAS dropped to an interactive Apple ID login. Set up the APNs key once on expo.dev or add EXPO_APPLE_ID + EXPO_APPLE_APP_SPECIFIC_PASSWORD secrets."; exit 3 }
            -re {\(Y/n\)}                          { send -- "\r";              exp_continue }
            -re {\(y/N\)}                          { send -- "y\r";             exp_continue }
            timeout { puts "\n::error::Stuck for 110 min with no progress. Check the log above for the prompt EAS was waiting on."; exit 2 }
            eof
          }
          catch wait result
          exit [lindex $result 3]
          EOF

      # eas submit needs submit.production.ios.ascAppId (the App Store Connect
      # numeric app id). Rather than commit it, resolve it at submit time from the
      # same ASC API key (a free API call, no build credit) and patch eas.json.
      # Fails loudly with the one-time action if the app record does not yet exist
      # in App Store Connect.
      - name: Self-test app-id resolver
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.submit }}
        run: node scripts/ci/resolve-asc-app-id.test.mjs

      - name: Resolve App Store Connect app id
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.submit }}
        env:
          ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_BUNDLE_ID: app.volyume
        run: node scripts/ci/resolve-asc-app-id.mjs

      # Submit ONLY on a manual run with the toggle ticked. A push-triggered
      # run (the temporary launch-branch verification) builds without
      # submitting, so nothing reaches TestFlight except by explicit choice.
      # With skip_build ticked, a manual run submits the latest existing EAS
      # build, no new build credit.
      - name: Submit to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.submit }}
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: eas submit --platform ios --latest --non-interactive
