name: Build iOS (EAS)

# Builds and (optionally) submits the iOS app entirely in CI, no Mac and no
# local terminal. EAS (Expo's cloud) does the Xcode compile and the Apple
# signing; this job just drives it non-interactively using:
#   - EXPO_TOKEN ............ Expo account access token (expo.dev)
#   - ASC_API_KEY_P8 ........ App Store Connect API key (.p8 file contents)
#   - ASC_KEY_ID ............ the key's Key ID
#   - ASC_ISSUER_ID ......... the key's Issuer ID
#   - EXPO_PUBLIC_* ......... the same app-config secrets the Android build uses
# all set in repo Settings → Secrets and variables → Actions.
#
# GOTCHA (cost us a day, 2026-06-10): EAS stores and REUSES the provisioning
# profile across builds. If a capability is added to the App ID later (e.g.
# Sign In with Apple), every new build is still signed with the OLD profile and
# the feature fails at runtime (ASAuthorizationError 1000, "authorization
# attempt failed for an unknown reason") even though the entitlement is in the
# binary and the capability is enabled. Fix: delete the provisioning profile on
# expo.dev → project → Credentials (keep the distribution certificate); the
# next build mints a fresh profile carrying all current App ID capabilities.
#
# The App Store Connect API key (role Admin) lets EAS create the distribution
# certificate + provisioning profile for you, and submit to TestFlight, with no
# interactive Apple login. app.json must carry the EAS project id (extra.eas.projectId).
#
# Trigger: push to main builds and submits automatically, the same shape as the
# Android workflow, so a merged change reaches the iPhone via TestFlight without
# a manual step. Two differences from Android, both because an EAS cloud build
# costs build credits (unlike the free GitHub-runner Android build):
#   - main only, not feature branches, so feature-branch pushes don't spend credits.
#   - paths-ignore for docs/markdown/config-only commits, so a docs edit doesn't
#     spend a credit.
# workflow_dispatch is kept so a build can still be run by hand, with a toggle to
# skip the TestFlight submit. The concurrency guard cancels an in-flight build
# when a newer push lands, so a superseded commit doesn't sit on a paid runner.
on:
  # Manual only: each EAS iOS build costs build credits, so this never auto-runs
  # on a push. Run it from the Actions tab -> "Build iOS (EAS)" -> Run workflow.
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit to TestFlight after the build finishes'
        type: boolean
        default: true
      skip_build:
        description: 'Skip the EAS build and submit the latest existing build (no build credit spent)'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# GitHub forces JavaScript actions onto Node 24 on 2026-06-16. Opt in early so
# CI proves Node 24 compatibility on our schedule, not on the forced flag day.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: EAS iOS build + submit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check required secrets are set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for v in EXPO_TOKEN ASC_API_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing repo secret: $v"; missing=1; fi
          done
          [ "$missing" = "0" ] || { echo "::error::Add the missing secrets in Settings → Secrets and variables → Actions, then re-run."; exit 1; }
          echo "✓ All required secrets present"

      - name: Write App Store Connect API key to a file
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc-api-key.p8"
          test -s "$RUNNER_TEMP/asc-api-key.p8" && echo "✓ ASC API key written ($(wc -c < "$RUNNER_TEMP/asc-api-key.p8") bytes)"

      # Push the app-config secrets up to EAS so the cloud build bundles real
      # values (not empty strings). Idempotent: --force overwrites if they exist.
      #
      # Sentry source-map upload: eas.json no longer disables it (1e2f1f3
      # enabled symbolicated prod crashes), so the @sentry/react-native build
      # phase runs sentry-cli on the EAS builder and needs SENTRY_AUTH_TOKEN.
      # That token lives on the EAS builder, not this GitHub runner, so it has
      # to be synced as an EAS secret here. If it is set, upload works and
      # crashes symbolicate. If it is NOT set, push SENTRY_DISABLE_AUTO_UPLOAD
      # so the build can't die at the upload step (unsymbolicated, the same
      # trade-off build-android.yml already takes). Either way the build
      # completes; it never fails on a missing token.
      - name: Sync app config to EAS
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_USDA_API_KEY: ${{ secrets.EXPO_PUBLIC_USDA_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          eas secret:create --scope project --name EXPO_PUBLIC_SUPABASE_URL --value "$EXPO_PUBLIC_SUPABASE_URL" --type string --force
          eas secret:create --scope project --name EXPO_PUBLIC_SUPABASE_ANON_KEY --value "$EXPO_PUBLIC_SUPABASE_ANON_KEY" --type string --force
          if [ -n "$EXPO_PUBLIC_SENTRY_DSN" ]; then eas secret:create --scope project --name EXPO_PUBLIC_SENTRY_DSN --value "$EXPO_PUBLIC_SENTRY_DSN" --type string --force; fi
          if [ -n "$EXPO_PUBLIC_USDA_API_KEY" ]; then eas secret:create --scope project --name EXPO_PUBLIC_USDA_API_KEY --value "$EXPO_PUBLIC_USDA_API_KEY" --type string --force; fi
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            eas secret:create --scope project --name SENTRY_AUTH_TOKEN --value "$SENTRY_AUTH_TOKEN" --type string --force
            eas secret:delete --scope project --name SENTRY_DISABLE_AUTO_UPLOAD --non-interactive 2>/dev/null || true
            echo "✓ SENTRY_AUTH_TOKEN synced (source maps will upload, crashes symbolicate)"
          else
            eas secret:create --scope project --name SENTRY_DISABLE_AUTO_UPLOAD --value "true" --type string --force
            echo "✓ No SENTRY_AUTH_TOKEN; disabled source-map upload so the build can't fail on it"
          fi
          echo "✓ Config synced to EAS"

      # First-time iOS credential creation cannot be done with --non-interactive:
      # EAS refuses to mint the very first Distribution Certificate without a real
      # terminal, even with all four ASC env vars set. The prompts it needs
      # answered (captured from prior runs' logs) are two select menus plus the
      # yes/no confirms:
      #     ? Select your Apple Team Type:
      #         Enterprise  /  Company/Organization  /  Individual
      #     ? Would you like to set up Push Notifications for your project?
      #         Yes  /  No  /  No, don't ask again
      # We drive it with `expect`: force interactive mode (CI=false), allocate a
      # pty so EAS sees a terminal, and pick "Individual" for the team type (3rd
      # item = two down-arrows then Return).
      #
      # Push setup is answered NO (2nd item = one down-arrow then Return). It must
      # be No, not Yes: creating the APNs key needs an interactive Apple Developer
      # login (Apple ID + password), which the App Store Connect API key cannot
      # do. Run #11 (2026-06-05) answered Yes, EAS created the cert + profile fine,
      # then asked to generate the push key, which dropped to "Log in to your Apple
      # Developer account ... Apple ID:" and hung the full 110 min. The build does
      # not need the push key: the provisioning profile already carries the Push
      # Notifications capability (entitlement), so the app builds and installs via
      # TestFlight. The APNs key (server-side send credential) is set up once
      # later, on expo.dev or by adding EXPO_APPLE_ID + EXPO_APPLE_APP_SPECIFIC_
      # PASSWORD secrets for username/password auth. Until then remote push won't
      # deliver, but nothing else is blocked.
      #
      # The Apple ID matcher is a fail-fast guard: if EAS ever drops to an
      # interactive login again, abort in seconds instead of burning 110 min of
      # paid runner. Once credentials exist on EAS, future runs work non-interactively.
      - name: Build iOS (EAS, waits for completion)
        if: ${{ !inputs.skip_build }}
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI: "false"
        run: |
          sudo apt-get install -y expect -qq 2>/dev/null
          expect <<'EOF'
          set timeout 6600
          spawn eas build --platform ios --profile production --wait
          expect {
            -re {Select your Apple Team Type}     { send -- "\033\[B\033\[B\r"; exp_continue }
            -re {set up Push Notifications}        { send -- "\033\[B\r";        exp_continue }
            -re {Apple ID:}                        { puts "\n::error::EAS dropped to an interactive Apple ID login. Push-key creation needs username/password auth the ASC API key cannot do; the build answers No to push setup to avoid it. If you see this, set up the APNs key once on expo.dev or add EXPO_APPLE_ID + EXPO_APPLE_APP_SPECIFIC_PASSWORD secrets."; exit 3 }
            -re {\(Y/n\)}                          { send -- "\r";              exp_continue }
            -re {\(y/N\)}                          { send -- "y\r";             exp_continue }
            timeout { puts "\n::error::Stuck for 110 min with no progress, aborting. Check the log above for the prompt EAS was waiting on."; exit 2 }
            eof
          }
          catch wait result
          exit [lindex $result 3]
          EOF

      # eas submit needs submit.production.ios.ascAppId (the App Store Connect
      # numeric app id). Rather than commit it, resolve it at submit time from the
      # same ASC API key (a free API call, no build credit) and patch eas.json.
      # Fails loudly with the one-time action if the app record does not yet exist
      # in App Store Connect.
      - name: Self-test app-id resolver
        if: ${{ github.event_name == 'push' || inputs.submit }}
        run: node scripts/ci/resolve-asc-app-id.test.mjs

      - name: Resolve App Store Connect app id
        if: ${{ github.event_name == 'push' || inputs.submit }}
        env:
          ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_BUNDLE_ID: app.volyume
        run: node scripts/ci/resolve-asc-app-id.mjs

      # Submit on every push (inputs.submit is empty for a push event, so the
      # bare `inputs.submit` used before would skip it). A manual run still
      # respects the toggle: untick it to build without submitting. With skip_build
      # ticked, this submits the latest existing EAS build, no new build credit.
      - name: Submit to TestFlight
        if: ${{ github.event_name == 'push' || inputs.submit }}
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: eas submit --platform ios --latest --non-interactive
