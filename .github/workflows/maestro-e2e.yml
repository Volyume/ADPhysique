name: Maestro E2E (Android emulator)

# Runs the smoke bundle on every push to the working branch so
# Claude can drive validation directly. workflow_dispatch is kept
# so a wider tag can be requested on demand.
#
# Final step writes a status report to .ci-status/maestro-latest.md
# and commits it back to the branch with [skip ci]. Lets Claude
# read the result via `git pull` without needing PR / Actions API
# access.
on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'e2e/**'
      - '.maestro/**'
      - 'src/**'
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'android/**'
      - '.github/workflows/maestro-e2e.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: "Maestro tag to run (smoke | full | foundation)"
        required: false
        default: "smoke"

permissions:
  contents: write

jobs:
  e2e:
    name: Run Maestro flows on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch enough history to push the status commit back cleanly
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM (required for Android emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        id: deps
        # npm ci so future package-lock.json drift fails CI loudly
        # instead of being silently papered over by 'npm install'.
        # Codex audit 2026-05-26 F11.
        run: npm ci --legacy-peer-deps

      - name: Install Maestro CLI
        id: install_maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-maestro-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: gradle-maestro-${{ runner.os }}-

      - name: Expo prebuild
        id: prebuild
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -e
          npx expo prebuild --platform android --no-install --clean 2>&1 | tee prebuild.log
          chmod +x android/gradlew

      # The next four steps mirror the patches in build-android.yml. They
      # are non-optional with the current Expo SDK 51 + AGP 8.2.1 + Gradle
      # 8.9 combination, which several deps (expo-notifications, react-
      # native-reanimated, @shopify/react-native-skia, react-native-iap)
      # don't fully agree with out of the box.
      - name: Pin Gradle wrapper to 8.9
        run: |
          PROPS=android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip|' "$PROPS"
          grep distributionUrl "$PROPS"

      - name: Patch expo-modules-core for AGP 8.4+ compatibility
        run: |
          FILE=node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
          sed -i '/from components\.release/d' "$FILE"

      - name: Patch @react-native/gradle-plugin for Gradle 8.7+ compatibility
        run: |
          FILE=node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/build.gradle.kts
          sed -i 's|org.gradle.configurationcache.extensions.serviceOf|org.gradle.kotlin.dsl.support.serviceOf|' "$FILE"

      # Bump Gradle's JVM heap. Run #3 OOM'd on JetifyTransform of
      # react-android-0.74.5-debug.aar. Run #4 was supposed to fix
      # this via android/gradle.properties but Gradle's daemon was
      # still reporting 512 MiB Xmx at runtime -- something else
      # (cached ~/.gradle/gradle.properties? actions/setup-java
      # default?) is winning the precedence fight. Belt and braces:
      # patch BOTH android/gradle.properties AND ~/.gradle/gradle.properties,
      # AND export GRADLE_OPTS on the build step itself, AND pass
      # via -D on the command line.
      - name: Bump Gradle heap to 4 GB everywhere
        run: |
          set -e
          JVMARGS='org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'

          PROPS=android/gradle.properties
          sed -i '/^org\.gradle\.jvmargs/d' "$PROPS"
          echo "$JVMARGS" >> "$PROPS"
          echo "android/gradle.properties:"
          grep 'org.gradle.jvmargs' "$PROPS"

          mkdir -p ~/.gradle
          USERPROPS=~/.gradle/gradle.properties
          if [ -f "$USERPROPS" ]; then
            sed -i '/^org\.gradle\.jvmargs/d' "$USERPROPS"
          fi
          echo "$JVMARGS" >> "$USERPROPS"
          echo "~/.gradle/gradle.properties:"
          grep 'org.gradle.jvmargs' "$USERPROPS"

      - name: Patch app/build.gradle for react-native-iap store flavor (play)
        run: |
          FILE=android/app/build.gradle
          if grep -q 'missingDimensionStrategy.*store.*play' "$FILE"; then
            echo "missingDimensionStrategy already present, skipping"
          else
            python3 - <<'PYEOF'
          import pathlib, re, sys
          p = pathlib.Path('android/app/build.gradle')
          src = p.read_text()
          new_src, count = re.subn(
              r'(defaultConfig\s*\{)',
              r"\1\n        missingDimensionStrategy 'store', 'play'",
              src,
              count=1,
          )
          if count == 0:
              print('::error::Could not find defaultConfig { in app/build.gradle')
              sys.exit(1)
          p.write_text(new_src)
          PYEOF
          fi

      # Diagnostic dump before the build. Captures everything Gradle
      # could possibly be reading heap settings from, so the next run
      # tells us WHY the previous run's -Xmx didn't take effect rather
      # than letting us keep guessing.
      - name: Diagnose Gradle environment
        run: |
          {
            echo "=== android/gradle.properties (post-patches) ==="
            cat android/gradle.properties || echo "(file missing)"
            echo
            echo "=== ~/.gradle/gradle.properties (if any) ==="
            cat ~/.gradle/gradle.properties 2>/dev/null || echo "(none)"
            echo
            echo "=== Relevant env vars ==="
            for v in JAVA_TOOL_OPTIONS _JAVA_OPTIONS JAVA_OPTS GRADLE_OPTS GRADLE_USER_HOME JAVA_HOME; do
              echo "$v=${!v:-<unset>}"
            done
            echo
            echo "=== android/local.properties ==="
            cat android/local.properties 2>/dev/null || echo "(none)"
            echo
            echo "=== gradle properties via gradlew (filtered) ==="
            (cd android && ./gradlew --no-daemon properties) 2>&1 | grep -Ei "jvmargs|maxworkers|workers.max|memory|heap" | head -30
          } | tee "${GITHUB_WORKSPACE:-$(pwd)}/gradle-diagnose.log"

      - name: Build debug APK
        id: build_apk
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -e
          # If the runner image set JAVA_TOOL_OPTIONS or _JAVA_OPTIONS
          # those win OVER gradle.properties for the JVM. Clear them
          # so our heap config is what Gradle uses. (Will be re-set on
          # the next step, this only affects gradlew.)
          unset JAVA_TOOL_OPTIONS
          unset _JAVA_OPTIONS
          cd android
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle-debug.log

      - name: Pre-Maestro runner diagnostics
        # Captures runner system state BEFORE the emulator action
        # runs, so a later emulator boot failure has the immediate-
        # context environment recorded. The status report tails
        # runner-diagnose.log so an offline reader can diagnose
        # without needing access to the Actions step logs. Codex
        # re-audit 2026-05-26 F4: previously a Maestro failure
        # left only "logs not produced" in the status doc because
        # the emulator action failed before the script body ran.
        if: always()
        run: |
          {
            echo "=== uname / kernel ==="
            uname -a
            echo
            echo "=== KVM availability ==="
            ls -l /dev/kvm 2>&1 || echo "/dev/kvm missing"
            kvm-ok 2>&1 | head -10 || echo "kvm-ok not installed"
            echo
            echo "=== CPU virt support ==="
            grep -E -m1 "vmx|svm" /proc/cpuinfo > /dev/null && echo "VT-x/AMD-V: yes" || echo "VT-x/AMD-V: NO"
            nproc
            echo
            echo "=== Memory ==="
            free -h
            echo
            echo "=== Disk ==="
            df -h /
            echo
            echo "=== Android SDK env ==="
            echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
            ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/* 2>&1 | head -20
            echo
            echo "=== AVDs already on disk ==="
            ls -la ~/.android/avd 2>&1 || echo "no AVD dir yet"
            echo
            echo "=== Available system images (filtered) ==="
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/latest/bin/sdkmanager --list_installed 2>&1 | grep -Ei "system-images|emulator" | head -20 || echo "sdkmanager list failed"
            echo
            echo "=== Running processes (top 20 by CPU) ==="
            ps aux --sort=-%cpu | head -20
          } | tee "${GITHUB_WORKSPACE:-$(pwd)}/runner-diagnose.log"

      - name: Run Maestro flows on emulator
        id: maestro_run
        # No `continue-on-error`. Codex audit 2026-05-26 (post-F7
        # follow-up): when continue-on-error was true, the step's
        # `conclusion` was masked to 'success' even though
        # `outcome` was 'failure', `job.status` followed
        # `conclusion`, and the status doc read `job.status`. The
        # net effect: the status doc said "success" while a later
        # fail-job step still triggered failure, exactly the
        # contradiction the founder hit. Removing continue-on-error
        # makes conclusion + outcome + job.status all agree.
        # The status report step below uses `if: always()` so it
        # still runs when this step fails.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # pre-emulator-launch-script runs inside the action AFTER
          # SDK setup + AVD creation, BEFORE emulator boot. Captures
          # the moment-of-boot state so a boot failure (the failure
          # mode that produced "_adb-install.log not produced_") has
          # the AVD config + system-image presence recorded in the
          # status doc tail. Codex re-audit 2026-05-26 F4.
          pre-emulator-launch-script: |
            {
              echo "=== AVD list ==="
              "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/cmdline-tools/latest/bin/avdmanager list avd 2>&1 | head -40 || true
              echo
              echo "=== Emulator binary ==="
              ls -la "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/emulator/emulator" 2>&1 || true
              echo
              echo "=== KVM at boot time ==="
              ls -l /dev/kvm 2>&1 || echo "/dev/kvm missing"
              echo
              echo "=== Free memory at boot time ==="
              free -h
            } | tee -a "${GITHUB_WORKSPACE:-$(pwd)}/runner-diagnose.log"
          script: |
            set +e
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee adb-install.log
            mkdir -p maestro-output
            maestro test \
              --include-tags=${{ github.event.inputs.tag || 'smoke' }} \
              --format junit \
              --output maestro-output/results.xml \
              --debug-output maestro-output/debug \
              e2e/ 2>&1 | tee maestro-output/run.log
            # PIPESTATUS[0] is maestro's exit code, not tee's (which is
            # always 0). Without this, the step outcome was 'success'
            # even when maestro failed, which propagated through to
            # job.status seen by the status report step and to the
            # downstream fail-job gate. Codex audit 2026-05-26 F7.
            MAESTRO_EXIT=${PIPESTATUS[0]}
            echo "MAESTRO_EXIT=$MAESTRO_EXIT" >> $GITHUB_ENV
            exit $MAESTRO_EXIT

      - name: Write status report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          MAESTRO_OUTCOME: ${{ steps.maestro_run.outcome }}
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          INSTALL_OUTCOME: ${{ steps.install_maestro.outcome }}
          TAG: ${{ github.event.inputs.tag || 'smoke' }}
        run: |
          set -e
          mkdir -p .ci-status

          # Tail the relevant logs so the status doc is self-contained
          # for a quick diagnose without downloading artefacts.
          tail_log () {
            local f="$1"
            local n="${2:-80}"
            if [ -f "$f" ]; then
              echo "<details><summary>$f (last $n lines)</summary>"
              echo
              echo '```'
              tail -n "$n" "$f"
              echo '```'
              echo
              echo '</details>'
            else
              echo "_$f not produced_"
            fi
          }

          {
            echo "# Latest Maestro E2E status"
            echo
            echo "- **Run number**: ${{ github.run_number }}"
            echo "- **Run URL**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- **Branch**: \`${{ github.ref_name }}\`"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Tag run**: \`$TAG\`"
            echo "- **Triggered at**: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- **Job status**: \`$JOB_STATUS\`"
            echo
            echo "## Step outcomes"
            echo
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| Install dependencies | \`$DEPS_OUTCOME\` |"
            echo "| Install Maestro CLI  | \`$INSTALL_OUTCOME\` |"
            echo "| Build debug APK      | \`$BUILD_OUTCOME\` |"
            echo "| Run Maestro flows    | \`$MAESTRO_OUTCOME\` |"
            echo
            echo "## Logs"
            echo
            tail_log gradle-diagnose.log 80
            echo
            tail_log prebuild.log 60
            echo
            tail_log gradle-debug.log 100
            echo
            tail_log adb-install.log 40
            echo
            tail_log maestro-output/run.log 200
          } > .ci-status/maestro-latest.md

      # Status doc kept as a workflow artefact only — uploaded by
      # the "Upload Maestro artefacts" step below. The previous
      # design committed it back to the branch via github-actions[bot];
      # see build-android.yml for the 2026-05-26 incident details
      # (run #714 status push failure, no triggers thereafter).

      - name: Surface Maestro status into the run summary
        # Appends the status doc to $GITHUB_STEP_SUMMARY so the run
        # page shows the build + maestro logs inline without an
        # artefact download. Lets a failure be diagnosed from chat
        # (the run page is publicly readable; the artefact isn't).
        if: always()
        run: |
          if [ -f .ci-status/maestro-latest.md ]; then
            cat .ci-status/maestro-latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_status report not produced — see step logs above_" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Maestro artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            maestro-output/**
            prebuild.log
            gradle-debug.log
            gradle-diagnose.log
            adb-install.log
            runner-diagnose.log
            .ci-status/maestro-latest.md
          if-no-files-found: warn

      # The explicit "Fail job if Maestro failed" step was removed.
      # With continue-on-error dropped from the maestro_run step, a
      # maestro failure now fails the step + the job directly, so
      # the explicit gate became a redundant second failure source
      # that read a different field (outcome) than the status doc
      # read (job.status), which is what produced the contradictory
      # "step success / fail-job triggered" picture.
