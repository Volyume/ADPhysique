<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Volyume</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0D0D0D">
<meta name="robots" content="noindex, nofollow">
<!--
  GitHub Pages 404 fallback. Pages serves this for any unmatched path (there is
  no server-side path rewriting). Its main job is to make the partner invite
  link work in its shared PATH form: an invite is
  https://volyume.app/partner/<CODE>, but only /partner/ (index.html) is a real
  file here, so a bare /partner/<CODE> would otherwise 404 for anyone without
  the app installed. Forward it to the landing page's query form, which renders
  the code and offers the store link. Everything else gets a real 404.
-->
<script>
  (function () {
    var m = location.pathname.match(/^\/partner\/([A-Za-z0-9]{8,})\/?$/);
    if (m) {
      location.replace('/partner/?c=' + m[1].toUpperCase());
    }
  })();
</script>
<style>
  :root{
    --bg:#0D0D0D; --surface:#191917; --border:#2E2E2C;
    --amber:#F5A623; --amberFill:#E08C0B; --text:#FFFFFF; --textSecondary:#9E9E9E;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html{color-scheme:dark;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
    -webkit-font-smoothing:antialiased; line-height:1.5;}
  .wrap{max-width:560px; margin:0 auto; padding:56px 24px 64px;}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:40px;}
  .brand img{height:36px; width:auto;}
  h1{font-weight:900; letter-spacing:-0.5px; font-size:clamp(28px,7vw,38px); line-height:1.1; margin:0 0 8px;}
  .lede{color:var(--textSecondary); font-size:18px; margin:0 0 32px;}
  .cta{display:inline-block; text-align:center; background:var(--amberFill); color:#0D0D0D; font-weight:800;
    font-size:17px; padding:16px 22px; border-radius:14px; text-decoration:none;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="/volyume-wordmark.png" alt="Volyume"></div>
    <h1>Page not found</h1>
    <p class="lede">That link doesn&rsquo;t lead anywhere on Volyume.</p>
    <a class="cta" href="/">Go to volyume.app</a>
  </div>
</body>
</html>
