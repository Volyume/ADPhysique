<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Confirming your email — Volyume</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0D0D0D">
<style>
  :root{
    --bg:#0D0D0D; --surface:#191917; --borderSubtle:#2E2E2C;
    --amber:#F5A623; --amberFill:#E08C0B;
    --text:#FFFFFF; --textSecondary:#9E9E9E; --textMuted:#9B9B9B;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html{color-scheme:dark;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);
    -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--borderSubtle);
    border-radius:20px;padding:40px 32px;text-align:center;}
  .logo{height:34px;width:auto;margin:0 auto 28px;display:block;}
  h1{font-size:24px;font-weight:800;letter-spacing:-0.25px;margin:0 0 12px;}
  p{font-size:15px;line-height:1.6;color:var(--textSecondary);margin:0 0 22px;}
  .spinner{width:26px;height:26px;border:3px solid var(--borderSubtle);border-top-color:var(--amber);
    border-radius:50%;margin:0 auto 22px;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media(prefers-reduced-motion:reduce){.spinner{animation:none;}}
  .btn{display:inline-block;background:var(--amberFill);color:var(--bg);font-weight:700;font-size:15px;
    text-decoration:none;border-radius:12px;padding:13px 24px;}
  .btn:hover{background:var(--amber);}
  .muted{font-size:13px;color:var(--textMuted);margin:18px 0 0;}
  .muted a{color:var(--amber);text-decoration:none;}
  #err{display:none;}
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/volyume-wordmark.png" alt="Volyume">

    <div id="main">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Confirming your email</h1>
      <p>One moment, we're taking you back to Volyume.</p>
      <a id="go" class="btn" href="#">Continue</a>
      <p class="muted">Not redirected automatically? Tap Continue above.</p>
    </div>

    <div id="err">
      <h1>This link can't be used</h1>
      <p>It looks like this confirmation link is invalid or has already been used. Open Volyume and request a new one.</p>
      <p class="muted"><a href="/privacy/">Privacy policy</a></p>
    </div>
  </main>

<script>
  (function(){
    // Public Supabase project endpoint. Carries the one-time token straight
    // through to Supabase's verify endpoint, the verification itself is
    // unchanged; only the link's domain (volyume.app) changes, which is what
    // keeps the email out of spam.
    var SUPABASE = 'https://sujrylzzxcqxxfygptns.supabase.co';
    var q = new URLSearchParams(location.search);
    var token = q.get('token') || q.get('token_hash');
    var type = q.get('type') || 'signup';
    var redirectTo = q.get('redirect_to') || 'volyume://';

    if (!token) {
      document.getElementById('main').style.display = 'none';
      document.getElementById('err').style.display = 'block';
      return;
    }

    var url = SUPABASE + '/auth/v1/verify'
      + '?token=' + encodeURIComponent(token)
      + '&type=' + encodeURIComponent(type)
      + '&redirect_to=' + encodeURIComponent(redirectTo);

    document.getElementById('go').setAttribute('href', url);
    // Small delay so the page paints first, then hand off to Supabase.
    setTimeout(function(){ window.location.replace(url); }, 500);
  })();
</script>
</body>
</html>
