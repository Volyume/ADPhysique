<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volyume members</title>
<meta name="description" content="Private page for the Volyume team.">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<style>
  :root{
    --bg:#0D0D0D; --surface:#191917; --surface2:#2A2A27;
    --border:#6E6E6E; --borderSubtle:#2E2E2C;
    --amber:#F5A623; --amberFill:#E08C0B; --amberBg:rgba(245,166,35,0.12);
    --onAmber:#0D0D0D;
    --text:#FFFFFF; --textSecondary:#B4B4B0; --textMuted:#9B9B9B;
    --danger:#FF8A7A; --ok:#7FD68B;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#F6F5F1; --surface:#FFFFFF; --surface2:#ECEAE4;
      --border:#8C887E; --borderSubtle:#D9D6CD;
      --amber:#8A5300; --amberFill:#E08C0B; --amberBg:rgba(224,140,11,0.14);
      --onAmber:#0D0D0D;
      --text:#1A1A18; --textSecondary:#4F4C46; --textMuted:#625F58;
      --danger:#B3261E; --ok:#1E7A33;
    }
  }
  *{box-sizing:border-box;}
  html{color-scheme:dark light; -webkit-text-size-adjust:100%;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
    font-size:1.0625rem; line-height:1.55; -webkit-font-smoothing:antialiased; overflow-wrap:anywhere;}
  a{color:var(--amber);}
  .wrap{max-width:760px; margin:0 auto; padding:0 16px;}

  header.top{background:#0D0D0D; color:#FFFFFF; border-bottom:1px solid #2E2E2C;}
  header.top .wrap{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px; padding-top:12px; padding-bottom:12px;}
  header.top img{height:36px; width:auto; display:block;}
  header.top .who{display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; font-size:.9rem; color:#B4B4B0;}

  main{padding:20px 0 64px;}
  h1{font-weight:900; letter-spacing:-0.3px; font-size:1.75rem; line-height:1.15; margin:0 0 8px;}
  h2{font-weight:800; font-size:1.25rem; line-height:1.25; margin:28px 0 10px;}
  h1:focus{outline:none;}
  p{margin:0 0 12px;}
  .muted{color:var(--textSecondary);}
  .small{font-size:.9rem; color:var(--textMuted);}

  .tabs{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 20px;}
  .tab{flex:1 1 auto;}

  .btn{display:inline-flex; align-items:center; justify-content:center; text-align:center; gap:8px;
    min-height:48px; padding:10px 18px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font:inherit; font-weight:700; cursor:pointer;}
  .btn:hover{border-color:var(--amber);}
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{outline:3px solid var(--amber); outline-offset:2px;}
  .btn-primary{background:var(--amberFill); border-color:var(--amberFill); color:var(--onAmber);}
  .btn-primary:hover{background:var(--amber); border-color:var(--amber); color:var(--bg);}
  .btn-danger{color:var(--danger);}
  .btn[disabled], .btn[aria-disabled="true"]{opacity:.5; cursor:default;}
  .btn.on{border-color:var(--amber); background:var(--amberBg);}
  .btn-quiet{background:transparent;}
  .btn-block{width:100%;}
  .row{display:flex; flex-wrap:wrap; gap:10px; margin:14px 0;}
  .row .btn{flex:1 1 12rem;}

  label.field{display:block; font-weight:700; margin:18px 0 6px;}
  .hint{display:block; font-weight:400; color:var(--textSecondary); font-size:.9rem; margin-top:2px;}
  input[type="text"], input[type="email"], input[type="search"], input[type="url"], textarea, select{
    width:100%; min-height:48px; padding:12px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font:inherit; font-size:1rem;}
  textarea{min-height:9rem; resize:vertical; line-height:1.5;}
  input[type="checkbox"]{width:1.5rem; height:1.5rem; accent-color:var(--amberFill); flex:0 0 auto;}
  .check{display:flex; align-items:center; gap:12px; min-height:48px; font-weight:600;}

  .card{background:var(--surface); border:1px solid var(--borderSubtle); border-radius:14px; padding:16px; margin:0 0 12px;}
  .card h3{margin:0 0 6px; font-size:1.0625rem; line-height:1.3;}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr)); gap:12px; margin:0 0 12px;}
  .stat .num{font-size:2rem; font-weight:900; line-height:1.1;}
  .stat .what{color:var(--textSecondary); font-size:.95rem;}
  .stat.big{grid-column:1 / -1;}
  .chip{display:inline-block; padding:2px 10px; border-radius:999px; border:1px solid var(--border); font-size:.85rem; font-weight:700; color:var(--textSecondary);}
  .chip.good{border-color:var(--ok); color:var(--ok);}
  .chip.warn{border-color:var(--amber); color:var(--amber);}

  .list{list-style:none; margin:0; padding:0;}
  .item{display:block; width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer; background:var(--surface);
    border:1px solid var(--borderSubtle); border-radius:14px; padding:14px 16px; margin:0 0 10px; min-height:48px;}
  .item:hover{border-color:var(--amber);}
  .item .t{font-weight:700;}
  .item .m{color:var(--textSecondary); font-size:.9rem; margin-top:2px;}

  .notice{border-radius:12px; padding:12px 14px; margin:0 0 16px; border:1px solid var(--borderSubtle); background:var(--surface);}
  .notice.error{border-color:var(--danger); color:var(--danger);}
  .notice.good{border-color:var(--ok);}
  .notice.warn{border-color:var(--amber);}
  .reasons{margin:8px 0 0; padding-left:1.2rem; color:var(--danger);}

  .qcard{background:var(--surface); border:1px solid var(--borderSubtle); border-radius:14px; padding:14px 16px; margin:0 0 14px;}
  .qcard .qhead{font-weight:900; color:var(--amber);}
  .bar{height:14px; border-radius:7px; background:var(--surface2); overflow:hidden; margin:4px 0 12px;}
  .bar > span{display:block; height:100%; background:var(--amberFill);}
  .answer{border-top:1px solid var(--borderSubtle); padding:10px 0; white-space:pre-wrap;}
  .person{border-top:1px solid var(--borderSubtle); padding:12px 0;}
  .person:first-child{border-top:none;}
  .person .em{font-weight:700;}
  .pager{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:14px 0;}
  .pager .btn{flex:1 1 8rem;}

  iframe.preview{width:100%; height:32rem; border:1px solid var(--borderSubtle); border-radius:12px; background:#FFFFFF;}
  pre.plain{white-space:pre-wrap; background:var(--surface); border:1px solid var(--borderSubtle); border-radius:12px; padding:12px; font:inherit; font-size:.9rem;}

  dialog{max-width:min(30rem, calc(100vw - 32px)); width:100%; border:1px solid var(--border); border-radius:16px;
    background:var(--surface); color:var(--text); padding:20px; font-family:var(--font); font-size:1.0625rem;}
  dialog::backdrop{background:rgba(0,0,0,0.6);}
  dialog h2{margin-top:0;}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <img src="/volyume-wordmark.png" alt="Volyume">
    <div class="who hidden" id="who">
      <span id="who-email"></span>
      <button type="button" class="btn btn-quiet" id="sign-out" style="color:#FFFFFF;border-color:#6E6E6E;min-height:44px">Sign out</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <noscript><p class="notice error">This page needs JavaScript to work.</p></noscript>
    <div id="notice-area" role="status" aria-live="polite"></div>
    <div id="app"></div>
  </div>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form method="dialog" id="dlg-form">
    <h2 id="dlg-title"></h2>
    <p id="dlg-body"></p>
    <div id="dlg-field" class="hidden">
      <label class="field" for="dlg-input" id="dlg-input-label"></label>
      <input type="text" id="dlg-input" maxlength="120" autocomplete="off">
    </div>
    <div class="row">
      <button type="button" class="btn btn-primary" id="dlg-ok"></button>
      <button type="button" class="btn" id="dlg-cancel">Cancel</button>
    </div>
  </form>
</dialog>

<script src="members.js"></script>
</body>
</html>
