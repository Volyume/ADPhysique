<!DOCTYPE html>

<head>

<title id="pageTitle">Volyume Community</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Volyume">
<meta property="og:title" content="Volyume">
<meta property="og:description" content="Strength training, tracked and shared as training facts only.">
<meta property="og:image" content="https://volyume.app/volyume-v.png">
<meta property="og:image:alt" content="Volyume">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Volyume">
<meta name="twitter:description" content="Strength training, tracked and shared as training facts only.">

<!--
  Programme sharing has retired (community product audit
  40-GAP-CLOSURE.md section 2; item 9 hygiene pass, B-05). This page used
  to fetch the shared programme from its Edge Function and render it;
  that endpoint no longer serves programmes, so the page is now static:
  a short notice and the two store links, nothing fetched, nothing
  scripted.

  An old /p/ link still opens the app straight to the Community Hub when
  the app is installed, through the verified app link (app.json
  autoVerify, host volyume.app, pathPrefix "/p") -- this page only
  renders for someone who does not have the app yet.
-->
<style>
  :root{
    --bg:#0D0D0D; --text:#FFFFFF; --textSecondary:#9E9E9E; --border:#2E2E2C;
    --amberFill:#E08C0B;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html{color-scheme:dark;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
    -webkit-font-smoothing:antialiased; line-height:1.5;}
  .wrap{max-width:560px; margin:0 auto; padding:56px 24px 64px;}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:40px;}
  .brand img{height:36px; width:auto;}
  .msg{color:var(--textSecondary); font-size:16px; margin:0 0 32px;}
  .cta{display:block; text-align:center; background:var(--amberFill); color:#0D0D0D; font-weight:800;
    font-size:17px; padding:16px; border-radius:14px; margin:0 0 12px; text-decoration:none;}
  .cta.secondary{background:transparent; color:var(--text); border:1px solid var(--border); font-weight:600;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="/volyume-wordmark.png" alt="Volyume"></div>
    <p class="msg">Programme sharing has retired. Open Volyume to see the Community.</p>
    <a class="cta" href="https://play.google.com/store/apps/details?id=app.volyume">Get Volyume on Android</a>
    <a class="cta secondary" href="https://apps.apple.com/gb/app/volyume/id6777083702">Get Volyume on iPhone</a>
  </div>
</body>
</html>
