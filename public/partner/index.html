<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volyume Community</title>
<meta name="description" content="Partner invites now open Volyume Community, where you can follow each other.">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0D0D0D">
<meta name="robots" content="noindex, nofollow">
<!--
  Legacy partner invite landing. The Partners feature is retired: the app now
  opens the Community tab for a /partner/ link and no longer carries the code
  (src/navigation/RootNavigator.js, LEGACY_PARTNER_PATH and its comment). Old
  share links still land here, so the page says only that, and offers the app
  and the store. Following each other: src/screens/CommunityFindPeopleScreen.js,
  src/screens/CommunityFollowersScreen.js.

  A static host cannot route /partner/<code> to this file; public/404.html
  sends that form here.
-->
<style>
  :root{
    --bg:#0D0D0D; --surface:#191917; --border:#2E2E2C;
    --amber:#F5A623; --amberFill:#E08C0B; --amberBg:rgba(245,166,35,0.12);
    --text:#FFFFFF; --textSecondary:#9E9E9E;
    --good:#7FB069; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html{color-scheme:dark;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
    -webkit-font-smoothing:antialiased; line-height:1.5;}
  .wrap{max-width:560px; margin:0 auto; padding:56px 24px 64px;}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:40px;}
  .brand img{height:36px; width:auto;}
  h1{font-weight:900; letter-spacing:-0.5px; font-size:clamp(28px,7vw,38px); line-height:1.1; margin:0 0 8px;}
  .lede{color:var(--textSecondary); font-size:18px; margin:0 0 32px;}
  .cta{display:block; text-align:center; background:var(--amberFill); color:#0D0D0D; font-weight:800;
    font-size:17px; padding:16px; border-radius:14px; margin:0 0 12px; text-decoration:none;}
  .cta.secondary{background:transparent; color:var(--text); border:1px solid var(--border); font-weight:600;}
  .muted{color:var(--textSecondary); font-size:14px; margin-top:24px;}
  a{color:var(--amber);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="/volyume-wordmark.png" alt="Volyume"></div>

    <h1>Partner invites now open Community</h1>
    <p class="lede">Partner invites now open Volyume Community, where you can follow each other. Get the app to see it.</p>

    <a class="cta" id="open" href="#">Open in Volyume</a>
    <a class="cta secondary" id="store" href="https://play.google.com/store/apps/details?id=app.volyume&referrer=utm_source%3Dvolyume.app%26utm_medium%3Dwebsite%26utm_campaign%3Dpartner">Get Volyume</a>

    <p class="muted">See our <a href="/privacy/">privacy policy</a>.</p>
  </div>

  <script>
    (function () {
      // The app opens Community for this link and no longer reads a code.
      document.getElementById('open').setAttribute('href', 'volyume://partner');

      // Store link: send iOS users to the App Store, everyone else to Google
      // Play (the default href in the markup).
      if (/iPad|iPhone|iPod/i.test(navigator.userAgent)) {
        // The same App Store link the get page carries.
        document.getElementById('store')
          .setAttribute('href', 'https://apps.apple.com/gb/app/volyume/id6777083702?ct=partner&mt=8');
      }
    })();
  </script>
</body>
</html>
